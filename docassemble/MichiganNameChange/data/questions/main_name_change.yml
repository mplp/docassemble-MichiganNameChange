# Build one ordered list of the actual person objects whose names are changing for PDF
# Later criminal-record, birth-certificate, publication, and attachment logic reuses this list of people changing names
id: set people changing names
depends on:
  - change_petitioner_name
  - change_spouse_name
  - change_children_names
  # Review actions can change which child objects belong in this calculated list
  - children.gathered
code: |
  people_changing_names = []
  
  # Preserve interview order: petitioner first, spouse second, and children afterward
  
  if change_petitioner_name:
    people_changing_names.append(users[0])
  if change_spouse_name:
    people_changing_names.append(spouse)
  if change_children_names:
    people_changing_names.extend(children)
---
# Provides the petitioner and any generic minor child as options when the spouse's name is not changing
id: initialize criminal record choices without spouse
if: change_petitioner_name and not change_spouse_name
depends on:
  - change_petitioner_name
  - change_spouse_name
  - change_children_names
  # The choice data displays the petitioner's current full name, so name edits must rebuild it
  - users[0].name.first
  - users[0].name.middle
  - users[0].name.last
  - users[0].name.suffix
code: |
  # Use stable internal keys while displaying the petitioner's current full legal name
  criminal_record_subject_choices = [
    {"petitioner": users[0].name.full(middle="full")}
  ]
  criminal_record_subject_labels = {
    "petitioner": users[0].name.full(middle="full")
  }

  # Use one minor-child category because the criminal-record follow-up does not identify the specific child for each charge
  if change_children_names:
    criminal_record_subject_choices.append(
      {"minor_child": "A minor child"}
    )
    criminal_record_subject_labels["minor_child"] = "a minor child"
---
# Provides the petitioner, spouse, and any generic minor child as options when the spouse's name is changing
id: initialize criminal record choices with spouse
if: change_spouse_name
depends on:
  - change_petitioner_name
  - change_spouse_name
  - change_children_names
  # Both adult names appear in the choice data, so edits to either name must rebuild it
  - users[0].name.first
  - users[0].name.middle
  - users[0].name.last
  - users[0].name.suffix
  - spouse.name.first
  - spouse.name.middle
  - spouse.name.last
  - spouse.name.suffix
code: |
  # Changing the spouse's name also means the petitioner is changing their own name
  # Use stable internal keys while displaying both adults' current full legal names
  criminal_record_subject_choices = [
    {"petitioner": users[0].name.full(middle="full")},
    {"spouse": spouse.name.full(middle="full")}
  ]
  criminal_record_subject_labels = {
    "petitioner": users[0].name.full(middle="full"),
    "spouse": spouse.name.full(middle="full")
  }

  # Use one minor-child category because the criminal-record follow-up does not identify the specific child for each charge
  if change_children_names:
    criminal_record_subject_choices.append(
      {"minor_child": "A minor child"}
    )
    criminal_record_subject_labels["minor_child"] = "a minor child"
---
# This path does not display either adult's name, so adult name fields are not dependencies
# The name change target variables remain dependencies so this result is rebuilt if the user changes whose name is being changed
id: initialize criminal record choices for children only
if: not change_petitioner_name and not change_spouse_name
depends on:
  - change_petitioner_name
  - change_spouse_name
  - change_children_names
code: |
  criminal_record_subject_choices = []
  criminal_record_subject_labels = {}

  if change_children_names:
