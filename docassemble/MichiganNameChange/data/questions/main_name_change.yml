---
metadata:
  title: Do-It-Yourself Name Change
  short title: Do-It-Yourself Name Change
  description: |
    Self-help interview to get documents needed to file for a name change in Michigan.
  tags:
    - Family
  authors:
    - Michigan Legal Help
    - Lemma Legal
---
features:
  labels above fields: True
---
sections:
  - signpost_intro: "Introduction"
  - signpost_qualify: "Is this tool right for you?"
  - signpost_user: "Your Information"
  - signpost_spouse: "Your Spouse"
  - signpost_children: "Your Children"
  - signpost_case: "Court and Case Information"
  - signpost_sign: "Sign Your Forms"
  - signpost_done: "Get Your Forms"
  - review_full: "✎ <u>Review / Edit</u>"
---
id: interview_order_name_change
mandatory: True
scan for variables: False
code: |
  nav.set_section("signpost_intro")
  MLH_standard_intro_pages

  nav.set_section("signpost_qualify")

  # Determine residency/court/kickout
  county_choice
  court_index
  the_court
  if not county_residency_one_year and not continue_despite_residency_requirement:
    residency_requirement_kickout

  # Criminal records kickout
  continue_after_criminal_records_intro
  if not continue_after_criminal_records_intro:
    criminal_records_intro_kickout

  # Fraudulence kickout
  fraudulent_name_change
  if fraudulent_name_change:
    fraudulent_intent_kickout

  # Gather petitioner information
  nav.set_section("signpost_user")
  users.gather()
  users[0].birthdate
  
  # Handle an unemancipated minor petitioner (gather parent/guardian information/consent status)
  if petitioner_is_minor:
    if users[0].age_in_years() < 14:
      petitioner_under_14_kickout
    else:
      emancipated_minor
      if not emancipated_minor:
  
        # Gather unemancipated petitioner's parent reference terms (mother/father first/second)
        parent_reference_terms

        # Gather petitioner's first parent
        minor_parent_one.name.first
        minor_parent_one.is_alive

        # Skip rest of parent one questions if they are deceased
        # Otherwise handle kickout scenarios and gather contact info
        if minor_parent_one.is_alive:

          # Handle petitioner's first parent kickout scenarios
          # Stop the interview if a living parent’s required consent is missing, no consent exception applies, or a consenting parent’s address is unknown
          if minor_parent_one.has_legal_custody and not minor_parent_one.agrees_to_name_change:
            minor_custodial_parent_disagrees_kickout
          elif not minor_parent_one.agrees_to_name_change and not minor_parent_one.consent_exception_applies:
            minor_no_parental_consent_exception_kickout
          if minor_parent_one.agrees_to_name_change and not minor_parent_one.whereabouts_known:
            minor_consenting_parent_address_unknown_kickout
  
          # When address is known -- gather petitioner's first parent contact info for consent or notice
          if minor_parent_one.whereabouts_known:
            minor_parent_one.address.address
            minor_parent_one.phone_number

        # Gather petitioner's second parent
        minor_parent_two.name.first
        minor_parent_two.is_alive

        # Skip rest of parent two questions if they are deceased
        # Otherwise handle kickout scenarios and gather contact info
        if minor_parent_two.is_alive:

          # Handle petitioner's second parent kickout scenarios
          # Stop the interview if a living parent’s required consent is missing, no consent exception applies, or a consenting parent’s address is unknown
          if minor_parent_two.has_legal_custody and not minor_parent_two.agrees_to_name_change:
            minor_custodial_parent_disagrees_kickout
          elif not minor_parent_two.agrees_to_name_change and not minor_parent_two.consent_exception_applies:
            minor_no_parental_consent_exception_kickout
          if minor_parent_two.agrees_to_name_change and not minor_parent_two.whereabouts_known:
            minor_consenting_parent_address_unknown_kickout

          # When address is known -- gather petitioner's second parent contact info for consent or notice
          if minor_parent_two.whereabouts_known:
            minor_parent_two.address.address
            minor_parent_two.phone_number

        # Gather petitioner's guardian info when applicable (both parents deceased or lack custody)
        # Handle kickout for a guardian who doesn't consent to the name change
        if ((not minor_parent_one.is_alive or not minor_parent_one.has_legal_custody) and (not minor_parent_two.is_alive or not minor_parent_two.has_legal_custody)):
          minor_guardian.name.first
          minor_guardian_agrees_to_name_change
          if minor_guardian_agrees_to_name_change:
            minor_guardian.address.address
            minor_guardian.phone_number
          else:
            minor_guardian_disagrees_kickout
  
      # Gather minor petitioner's new name and reason for name change
      # Emancipated minors are not asked for a reason (matches LHI behavior)
      # Evaluating "not emancipated_minor" again here keeps the interview order the same as LHI (but "reason_for_name_change" could be moved into the unemancipated minor path above if we want to change it)
      users[0].new_name.first
      if not emancipated_minor:
        reason_for_name_change
      change_petitioner_name
    
  # Gather petitioner's contact info (all ages/filing statuses)
  users[0].address.address
  users[0].phone_number

  # Handle an adult petitioner
  if not petitioner_is_minor:

    # Determine who is asking for a name change (petitioner/spouse/children)
    # Not asked for minor petitioner -- minors can only ask to change their own name
    # Married petitioner has no option to only change spouse name -- petitioner must be changing their name too or the spouse must submit their own petition
    name_change_target_group

    # Active divorce kickout (when petitioner chooses to change name through their active divorce case)
    if (
      name_change_target_group == "adults"
      and adults_changing_name == "myself"
      and pending_divorce_case
      and divorce_name_change_path == "divorce"
    ):
      divorce_name_change_kickout

    # Gather adult petitioner's new name when applicable
    if change_petitioner_name:
      users[0].new_name.first

    # Gather spouse information when applicable (petitioner is also requesting spouse's name change)
    if change_spouse_name:
      nav.set_section("signpost_spouse")
      spouse.name.first
      spouse.birthdate
      spouse.phone_number
      spouse_address_same_as_user
      spouse.new_name.first
      if not spouse_address_same_as_user:
        spouse.address.address

    # Gather children information when applicable
    if change_children_names:
      nav.set_section("signpost_children")

      # Handle guardian petitioner -- gather parent information
      if petitioner_relationship_to_children == "guardian":

        # Gather parent reference terms (mother/father first/second)
        parent_reference_terms

        # Determine whether first parent is deceased and gather their name
        minor_parent_one.is_alive
        if not minor_parent_one.is_alive:
          minor_parent_one.name.first

        # Kickout for first parent being alive regardless of their competency status (matches current LHI bahvior, which doesn't allow a guardian to continue if either parent is alive)
        elif minor_parent_one.is_alive:
          if minor_parent_one.legally_incompetent_status == "yes":
            guardian_legally_incompetent_parent_kickout
          elif minor_parent_one.legally_incompetent_status == "no" or minor_parent_one.legally_incompetent_status == "unknown":
            guardian_living_parent_kickout

        # Determine whether second parent is deceased and gather their name
        minor_parent_two.is_alive
        if not minor_parent_two.is_alive:
          minor_parent_two.name.first

        # Kickout for second parent being alive regardless of their competency status (matches current LHI bahvior, which doesn't allow a guardian to continue if either parent is alive)
        if minor_parent_two.is_alive:
          if minor_parent_two.legally_incompetent_status == "yes":
            guardian_legally_incompetent_parent_kickout
          elif minor_parent_two.legally_incompetent_status == "no" or minor_parent_two.legally_incompetent_status == "unknown":
            guardian_living_parent_kickout

        # Gather number of children changing name for a guardian petitioner
        # Asked here because the guardian path has it's own question (whereas biological parent path assigns it through petitioner_has_legal_custody_of_all_children)
        children.target_number

      # Handle biological parent petitioner -- gather parent information
      if petitioner_relationship_to_children == "biological":

        # Handle petitioner custody and different parent kickout scenarios
        # When petitioner_has_legal_custody_of_all_children is True, the children.target_number is gathered on that same question screen (could be broken out if we want)
        if not petitioner_has_legal_custody_of_all_children:
          children_legal_custody_kickout
        if not children_have_same_other_parent:
          children_different_parents_kickout

        # Handle gathering other parent info if spouse is not other parent or spouse's name is not being changed in this petition
        children_other_parent_questions_needed
        if children_other_parent_questions_needed:
          other_parent.name.first
          children_other_parent.is_alive

          # Handle other parent kickout scenarios
          if children_other_parent.is_alive and children_other_parent.has_joint_legal_custody and not children_other_parent.whereabouts_known:
            custodial_parent_whereabouts_unknown_kickout
          if children_other_parent.is_alive and children_other_parent.has_joint_legal_custody and not children_other_parent.agrees_to_name_change:
            joint_custody_parent_disagrees_kickout
          if children_other_parent.is_alive and not children_other_parent.has_joint_legal_custody and not children_other_parent.agrees_to_name_change and not children_other_parent.consent_exception_applies:
            no_parental_consent_exception_kickout

      # Gather children information for all adult petitioner scenarios
      children.gather()

      # Gather other parent contact information when applicable (this matches current LHI order, gathering other parent contact info after children information)
      # We could move this before gathering children (in the previous biological parent petitioner path) so that we don't evaluate petitioner_relationship_to_children == "biological twice so close together but that would require some order changes or repeating children.gather() in both paths
      if petitioner_relationship_to_children == "biological" and children_other_parent_questions_needed and other_parent.is_alive and other_parent.whereabouts_known:
        other_parent.address_same_as_user
        if not other_parent.address_same_as_user:
          other_parent.address.address
        other_parent.phone_number

  # Determine whether there are prior family cases and gather them
  nav.set_section("signpost_case")
  prior_family_cases.gather()

  # Determine whether there are criminal records and gather them
  if len(people_changing_names) == 1:
    single_person_has_criminal_record
  else:
    people_with_criminal_records
  criminal_records.gather()

  # Determine whether birth certificate will display both names or only new name for each person
  birth_certificate_option

  # Determine whether publication is ok with petitioner
  publication_is_ok

  # Gather reasons not to publish (who it impacts, why, and specific incidents)
  if not publication_is_ok:
    why_not_publish
    if why_not_publish["danger"]:
      publication_danger_who
      if publication_incidents.there_are_any:
        publication_incidents.gather()
      if publication_danger_reasons["gender_identity"]:
        danger_gender_statement_choice
    if why_not_publish["discrimination"]:
      discrimination_who
      if discrimination_reasons["gender_identity"]:
        discrimination_gender_statement_choice
    no_publication_and_basis_of_fear_details_value

  nav.set_section("signpost_sign")
  MLH_standard_outro_pages

  nav.set_section("signpost_done")
  MLH_download
---
# Add survey info when time
code: |
  survey_link_url_only = "#"
---
template: survey_embed_script
content: |
  <script>
  </script>
---
# Set intro landing screen variables
code: |
  MLH_form_type = "forms"
  MLH_time_min = 20
  MLH_time_max = 30
---
# Set e-signature support
# Need to add logic for new forms if they don't support e-signature
# PC51 and PC51c both support e-sign by petitioner
code: |
  MLH_esign_supported = True
---
# Set form type
code: |
  al_form_type = 'starts_case'
---
# For framework court loader logic
code: |
  filing_court = "circuit_only"
  ottawa_circuit_location = "Grand Haven"
---
objects:
  - users: ALPeopleList.using(
      there_are_any=True,
      there_is_another=False,
      target_number=1
      )
  - spouse: ALIndividual
  - other_parent: ALIndividual
  - minor_parent_one: ALIndividual
  - minor_parent_two: ALIndividual
  - minor_guardian: ALIndividual
  - children: ALPeopleList.using(
      ask_number=True,
      minimum_number=1,
      complete_attribute="name_change_complete"
      )
  - prior_family_cases: DAList.using(
      ask_number=False,
      complete_attribute="complete",
      object_type=DAObject
      )
  - criminal_records: DAList.using(
      ask_number=False,
      complete_attribute="complete",
      object_type=DAObject
      )
  - publication_incidents: DAList.using(
      ask_number=False,
      complete_attribute="complete",
      object_type=DAObject
      )
---
generic object: ALIndividual
objects:
  - x.new_name: IndividualName
---
id: residence requirement
question: |
  Residence Requirement
subquestion: |
  You and everyone whose name will be changed must have lived in the same county for one full year before you file your petition.
fields:
  - Have you and everyone whose name will be changed lived in ${ county_choice } County for at least one year?: county_residency_one_year
    datatype: yesnoradio
  - note: |
      We're sorry, this tool is not right for you. Anyone seeking a name change must have lived in the county for at least one year before you can file the petition. You can continue with the tool and print it off, but you will not be able to file it until the one year requirement is met.
    show if:
      variable: county_residency_one_year
      is: False
  - Do you want to continue?: continue_despite_residency_requirement
    datatype: yesnoradio
    show if:
      variable: county_residency_one_year
      is: False
---
id: residency requirement kickout
event: residency_requirement_kickout
question: |
  This tool may not be right for you
subquestion: |
  Anyone seeking a name change must have lived in the county for at least one year before the petition can be filed.

  If you think you made a mistake, tap **Undo** and change the answer to this question.
action buttons:
  - label: Exit
    action: https://michiganlegalhelp.org
    new window: True
    color: danger
    icon: right-from-bracket
---
id: criminal records intro
question: |
  Criminal Records
subquestion: |
  Every person who wants their name changed will be asked if they have a criminal record. If any criminal records do exist, you will need to know the charge and when it happened. The court may choose to schedule a hearing to decide whether the person wants a name change for fraudulent reasons.

  For more information about this, read [I Want to Change My Name](https://michiganlegalhelp.org/resources/family/i-want-change-my-name).
fields:
  - Do you want to continue?: continue_after_criminal_records_intro
    datatype: yesnoradio
---
id: criminal records intro kickout
event: criminal_records_intro_kickout
question: |
  This tool may not be right for you
subquestion: |
  You chose not to continue after reading the information about criminal records.

  If you think you made a mistake, tap **Undo** and change the answer to this question.
action buttons:
  - label: Exit
    action: https://michiganlegalhelp.org
    new window: True
    color: danger
    icon: right-from-bracket
---
id: fraudulent intent
question: |
  Fraudulent Intent
subquestion: |
  Examples of fraud include wanting a name change to escape criminal history or deceive creditors.
fields:
  - Do you want this name change for a fraudulent reason?: fraudulent_name_change
    datatype: yesnoradio
---
id: fraudulent intent kickout
event: fraudulent_intent_kickout
question: |
  We're sorry, this tool is not right for you.
subquestion: |
  You cannot change your name for a fraudulent reason.

  If you think you made a mistake, tap **Undo** and change the answer to this question.
action buttons:
  - label: Exit
    action: https://michiganlegalhelp.org
    new window: True
    color: danger
    icon: right-from-bracket
---
sets:
  - users[0].name.first
  - users[0].name.middle
  - users[0].name.last
  - users[0].name.suffix
id: petitioner current name
question: |
  What is your current legal name?
subquestion: |
  ${ collapse_template(minor_name_change_help_template) }
  ${ collapse_template(children_name_change_help) }
  ${ collapse_template(adults_changing_name_help) }
fields:
  - code: |
      users[0].name_fields(
        person_or_business="person",
        show_suffix=True
      )
---
template: minor_name_change_help_template
subject: |
  What if I am a minor changing my name?
content: |
  For children and teens under age 18. If you are 13 or younger, you must have a parent or guardian file for you, and their information should go on this screen. If you are 14 or older, you can enter your own information here and continue.
---
template: children_name_change_help
subject: |
  What if I am changing my child's name?
content: |
  If you are a parent asking to change the name of your minor child, enter **your** information here even if your name is not changing. You will enter the child's information later.
---
template: adults_changing_name_help
subject: |
  What if I am an adult changing my name?
content: |
  If you are an adult asking to change your own name, enter your information here. If your spouse or children are also changing their name, you will enter their information later.
---
id: petitioner birthdate
question: |
  What is your date of birth?
fields:
  - Date of birth: users[0].birthdate
    datatype: ThreePartsDate
---
id: calculate petitioner age
depends on:
  - users[0].birthdate
code: |
  petitioner_is_minor = users[0].age_in_years() < 18
---
# Need to decide what version of kickout language to go with.
id: petitioner under 14 kickout
event: petitioner_under_14_kickout
question: |
  We're sorry, this tool is not right for you.
subquestion: |
  # original line from hotdocs:
  A judge will not approve your proposed name change if you are younger than 14 years old.
  # line AI came up with:
  If you are 13 or younger, a parent or legal guardian must file the name change petition for you.

  If you think you made a mistake, tap **Undo** and change your date of birth.
action buttons:
  - label: Exit
    action: https://michiganlegalhelp.org
    new window: True
    color: danger
    icon: right-from-bracket
---
id: minor emancipation status
question: |
  You Are Under 18
fields:
  - Are you an emancipated minor?: emancipated_minor
    datatype: yesnoradio
  - note: |
      You will need to file a copy of the Order of Emancipation with your Petition for Name Change.
    show if:
      variable: emancipated_minor
      is: True
  - note: |
      If you are a minor there are special rules for changing your name. If you are 14 years old or older you can ask the court to change your name, but both of your parents must agree to your proposed name change.

      If your noncustodial parent objects to your proposed name change, the court may still approve it if:

      * That parent failed to provide you with substantial support for the last two years, and that parent has not had substantial contact with you in the last two years; OR
      * That parent has been convicted of child abuse or a sexual assault crime and you or one of your siblings was the victim.

      If both of your parents are deceased, your legal guardian must consent to your name change. You must submit letters of guardianship with your **Petition for Name Change**.
    show if:
      variable: emancipated_minor
      is: False
---
# Ask for parent reference/relationship to child terms for minor and guardian petitioners
id: parent labels
question: |
  ${ "Your parents" if petitioner_is_minor else "Parent Information" }
fields:
  - label: |
      How should we refer to ${ "your parents" if petitioner_is_minor else "the child(ren)'s parents" }?
    field: parent_reference_terms
    input type: radio
    choices:
      - Mother / Father: mother_father
      - First Parent / Second Parent: first_second
  - note: |
      The answer to this question only affects the language used in this tool. It will not affect your forms in any way.
---
# Set minor parent relationship labels (only used directly in interview to refer to parents while collecting their info)
id: parent relationship labels
depends on:
  - parent_reference_terms
code: |
  if parent_reference_terms == "mother_father":
    minor_parent_one.relationship_label = "mother"
    minor_parent_two.relationship_label = "father"
  else:
    minor_parent_one.relationship_label = "first parent"
    minor_parent_two.relationship_label = "second parent"
---
# Gather minor parent info for guardian petitioner - using generic object since the same set of questions is asked twice
generic object: ALIndividual
id: guardian parent information
question: |
  ${ x.relationship_label.capitalize() } Information
fields:
  - Is the children's ${ x.relationship_label } still alive?: x.is_alive
    datatype: yesnoradio
  - Has the children's ${ x.relationship_label } been declared a legally incompetent adult?: x.legally_incompetent_status
    input type: radio
    choices:
      - Yes: yes
      - No: no
      - I don't know: unknown
    js show if: |
      val("x.is_alive")
  - note: |
      **We're sorry, this tool is not right for you. A situation with a legally incompetent parent is too complicated for this tool.**
    js show if: |
      val("x.is_alive") && val("x.legally_incompetent_status") === "yes"
  - note: |
      **We're sorry, this tool is not right for you. You're not allowed to change the names of children under your care while their parent is still alive unless the parent is a legally incompetent adult.**
    js show if: |
      val("x.is_alive") && (val("x.legally_incompetent_status") === "no" || val("x.legally_incompetent_status") === "unknown")
---
# Living parent kickout for guardian petitioner -- wording should probably be reconsidered since we also don't allow them to continue with a living legally incompetent parent either
# Currently matches LHI behavior/wording
id: guardian living parent kickout
event: guardian_living_parent_kickout
question: |
  This tool is not right for you
subquestion: |
  You're not allowed to change the names of children under your care while their parent is still alive unless the parent is a legally incompetent adult.

  If you think you made a mistake, tap **Undo** and change your answer.
action buttons:
  - label: Exit
    action: https://michiganlegalhelp.org
    new window: True
    color: danger
    icon: right-from-bracket
---
# Kickout guardian petitioner when there is a living but legally incompetent parent
id: guardian legally incompetent parent kickout
event: guardian_legally_incompetent_parent_kickout
question: |
  This tool is not right for you
subquestion: |
  A situation with a legally incompetent parent is too complicated for this tool.

  If you think you made a mistake, tap **Undo** and change your answer.
action buttons:
  - label: Exit
    action: https://michiganlegalhelp.org
    new window: True
    color: danger
    icon: right-from-bracket
---
template: minor_legal_custody_help
subject: |
  What does “**legal custody**” mean?
content: |
  A parent with legal custody has authority to make big decisions for you, like where you will go to school and consenting to medical treatment. This could be one of your parents (“sole” legal custody) or both parents (“joint” legal custody). A parent can have legal custody even if they do not have physical custody.

  There should be a court order deciding your legal custody if your parents got divorced after you were born, or if they went to court for child support, parenting time, paternity, or custody. If you do not know whether there is a court order or what the order says, talk to your parents or ask them to see your custody papers. If there is a court order, you can also request a copy from the court where your parents’ case was.

  If there is no court order about your custody, one or both parents may have legal custody. For example, if your parents were married to each other when you were born and they are still married, they probably both have legal custody. If your parents are not married to each other and there is no court order, your mother (or the parent who gave birth to you) probably has legal custody of you, and your other parent probably does not.
---
# For minor or guardian petitioner -- gather minor first parent name
id: first minor parent name
sets:
  - minor_parent_one.name.first
  - minor_parent_one.name.middle
  - minor_parent_one.name.last
  - minor_parent_one.name.suffix
question: |
  ${ minor_parent_one.relationship_label.capitalize() } Information
subquestion: |
  % if petitioner_is_minor:
  Enter your ${ minor_parent_one.relationship_label }'s full legal name.
  % else:
  Enter the ${ minor_parent_one.relationship_label }'s full legal name.
  % endif
fields:
  - code: |
      minor_parent_one.name_fields(
        person_or_business="person",
        show_suffix=True
      )
---
# For minor or guardian petitioner -- gather minor second parent name
id: second minor parent name
sets:
  - minor_parent_two.name.first
  - minor_parent_two.name.middle
  - minor_parent_two.name.last
  - minor_parent_two.name.suffix
question: |
  ${ minor_parent_two.relationship_label.capitalize() } Information
subquestion: |
  % if petitioner_is_minor:
  Enter your ${ minor_parent_two.relationship_label }'s full legal name.
  % else:
  Enter the ${ minor_parent_two.relationship_label }'s full legal name.
  % endif
fields:
  - code: |
      minor_parent_two.name_fields(
        person_or_business="person",
        show_suffix=True
      )
---
# Gather minor parent information for minor petitioner
# Gather other parent information for adult petitioner changing childrens names
# This question is skipped when spouse is the other parent since they are alive and their consent is assumed (matches LHI behavior)
# The minor-petitioner and adult-petitioner versions collect different custody answers
# An emancipated minor never sees this screen because parent info is skipped
generic object: ALIndividual
id: parent information
depends on:
  - petitioner_is_minor
question: |
  % if petitioner_is_minor:
  ${ x.name.first }'s Information
  % else:
  Changing Your Children's Names, Part 2
  % endif
subquestion: |
  % if not petitioner_is_minor:
  **Warning!** If you're trying to change the name of a child, all parents who share legal custody of the child have to agree to the proposed name change. Only a custodial parent can request a child's name be changed. However, the noncustodial parent must be given notice of the name change and hearing notice. If you want to learn more about changing a child's name, please return to **Michigan Legal Help** and read the [Changing Your Minor Child's Name](https://michiganlegalhelp.org/resources/family/changing-your-minor-childs-name) article.
  % endif
fields:
  - Is ${ x.name.first } still alive?: x.is_alive
    datatype: yesnoradio
  - Do you know where ${ x.name.first } lives?: x.whereabouts_known
    datatype: yesnoradio
    js show if: |
      val("x.is_alive") === true
  - Does ${ x.name.first } have legal custody of you? This could be joint legal custody or sole legal custody.: x.has_legal_custody
    datatype: yesnoradio
    show if:
      code: petitioner_is_minor
    js show if: |
      val("x.is_alive") === true && (val("x.whereabouts_known") === true || val("x.whereabouts_known") === false)
  - note: |
      ${ collapse_template(minor_legal_custody_help) }
    show if:
      code: petitioner_is_minor
    js show if: |
      val("x.is_alive") === true && (val("x.whereabouts_known") === true || val("x.whereabouts_known") === false)
  - Does ${ x.name.first } have joint legal custody of the ${ "child" if petitioner_is_minor or children.target_number == 1 else "children" }?: x.has_joint_legal_custody
    datatype: yesnoradio
    show if:
      code: not petitioner_is_minor
    js show if: |
      val("x.is_alive") === true
  - Is ${ x.name.first } also asking the judge to change your ${ "child's name" if petitioner_is_minor or children.target_number == 1 else "children's names" }?: x.agrees_to_name_change
    datatype: yesnoradio
    show if:
      code: not petitioner_is_minor
    js show if: |
      val("x.is_alive") === true && val("x.whereabouts_known") === true && val("x.has_joint_legal_custody") === true
  - label: |
      Does ${ x.name.first } agree to the name change?

      *Pick “Yes” only if ${ x.name.first } is willing to sign forms consenting to the change.*
    field: x.agrees_to_name_change
    datatype: yesnoradio
    show if:
      code: petitioner_is_minor
    js show if: |
      val("x.is_alive") === true && (val("x.whereabouts_known") === true || val("x.whereabouts_known") === false) && (val("x.has_legal_custody") === true || val("x.has_legal_custody") === false)
  - Does ${ x.name.first } agree with the name change?: x.agrees_to_name_change
    datatype: yesnoradio
    show if:
      code: not petitioner_is_minor
    js show if: |
      val("x.is_alive") === true && val("x.has_joint_legal_custody") === false
  - note: |
      **Sorry, this tool is not right for you. A parent with legal custody must agree to a child's name change.**
    show if:
      code: petitioner_is_minor
    js show if: |
      val("x.is_alive") === true && val("x.has_legal_custody") === true && val("x.agrees_to_name_change") === false
  - note: |
      **We're sorry, this tool is not right for you. You cannot ask a judge to change the name of your child if your child's other parent has custody, but his or her whereabouts are unknown. You may want to contact a lawyer to help you with this matter. You can use the [Guide to Legal Help](https://michiganlegalhelp.org/guide-to-legal-help) on Michigan Legal Help to find a lawyer or a legal services office near you.**
    show if:
      code: not petitioner_is_minor
    js show if: |
      val("x.is_alive") === true && val("x.whereabouts_known") === false && val("x.has_joint_legal_custody") === true
  - note: |
      **Sorry, this tool is not right for you. Both parents with joint legal custody must agree to the child's name change.**
    show if:
      code: not petitioner_is_minor
    js show if: |
      val("x.is_alive") === true && val("x.whereabouts_known") === true && val("x.has_joint_legal_custody") === true && val("x.agrees_to_name_change") === false
  - Has ${ x.name.first } failed to visit, contact, or communicate with ${ "you" if petitioner_is_minor else ("the child" if children.target_number == 1 else "the children") } for the last two years?: x.failed_contact_two_years
    datatype: yesnoradio
    js show if: |
      val("x.is_alive") === true && val("${ 'x.has_legal_custody' if petitioner_is_minor else 'x.has_joint_legal_custody' }") === false && val("x.agrees_to_name_change") === false
  - Select one: x.support_failure_type
    input type: radio
    choices:
      - "A support order has been entered and ${ x.name.first } has failed to substantially comply with the order for a period of two years": support_order
      - "A support order has not been entered and ${ x.name.first } has failed or neglected to provide support for two years": no_support_order
    js show if: |
      val("x.is_alive") === true && val("${ 'x.has_legal_custody' if petitioner_is_minor else 'x.has_joint_legal_custody' }") === false && val("x.agrees_to_name_change") === false && val("x.failed_contact_two_years") === true
  - Has ${ x.name.first } been convicted of child abuse, criminal sexual conduct, or assault with intent to commit criminal sexual conduct with ${ "you or a sibling" if petitioner_is_minor else ("the child or a sibling of the child" if children.target_number == 1 else "the children or a sibling of the children") } as the victim?: x.abuse_conviction
    datatype: yesnoradio
    js show if: |
      val("x.is_alive") === true && val("${ 'x.has_legal_custody' if petitioner_is_minor else 'x.has_joint_legal_custody' }") === false && val("x.agrees_to_name_change") === false
  - note: |
      **Attach a copy of the judgment of sentence.**
    js show if: |
      val("x.is_alive") === true && val("${ 'x.has_legal_custody' if petitioner_is_minor else 'x.has_joint_legal_custody' }") === false && val("x.agrees_to_name_change") === false && val("x.abuse_conviction") === true
  - Has ${ x.name.first } been convicted of first degree murder or second degree murder?: x.murder_conviction
    datatype: yesnoradio
    js show if: |
      val("x.is_alive") === true && val("${ 'x.has_legal_custody' if petitioner_is_minor else 'x.has_joint_legal_custody' }") === false && val("x.agrees_to_name_change") === false
  - note: |
      **Attach a copy of the judgment of murder sentence.**
    js show if: |
      val("x.is_alive") === true && val("${ 'x.has_legal_custody' if petitioner_is_minor else 'x.has_joint_legal_custody' }") === false && val("x.agrees_to_name_change") === false && val("x.murder_conviction") === true
  - note: |
      **Sorry, Michigan law requires the agreement of both parents to change a minor's name except under limited circumstances. Based on your answers, none of these circumstances are present in your case.**
    show if:
      code: not petitioner_is_minor
    js show if: |
      val("x.is_alive") === true && val("x.has_joint_legal_custody") === false && val("x.agrees_to_name_change") === false && val("x.failed_contact_two_years") === false && val("x.abuse_conviction") === false && val("x.murder_conviction") === false
  - note: |
      **If ${ x.name.first } agrees to the name change, you need their current address for the paperwork.**
    show if:
      code: petitioner_is_minor
    js show if: |
      val("x.is_alive") === true && val("x.agrees_to_name_change") === true && val("x.whereabouts_known") === false
---
# Determine whether a consent exception applies to any (non-petitioner) minor parent when the petitioner is a minor
# Needs to stay separate from the adult-petitioner consent exception block for dependancy and review-screen recalucaltions
generic object: ALIndividual
id: minor parent consent exception
if: petitioner_is_minor
depends on:
  - petitioner_is_minor
  - x.is_alive
  - x.has_legal_custody
  - x.agrees_to_name_change
  - x.failed_contact_two_years
  - x.abuse_conviction
  - x.murder_conviction
code: |
  x.consent_exception_applies = (
    x.is_alive
    and not x.has_legal_custody
    and not x.agrees_to_name_change
    and (
      x.failed_contact_two_years
      or x.abuse_conviction
      or x.murder_conviction
    )
  )
---
# Determine whether a consent exception applies to any (petitioner) minor parent when the petitioner is an adult
# Needs to stay separate from the minor-petitioner consent exception block for dependancy and review-screen recalucaltions
generic object: ALIndividual
id: other parent consent exception
if: not petitioner_is_minor
depends on:
  - petitioner_is_minor
  - x.is_alive
  - x.has_joint_legal_custody
  - x.agrees_to_name_change
  - x.failed_contact_two_years
  - x.abuse_conviction
  - x.murder_conviction
code: |
  x.consent_exception_applies = (
    x.is_alive
    and not x.has_joint_legal_custody
    and not x.agrees_to_name_change
    and (
      x.failed_contact_two_years
      or x.abuse_conviction
      or x.murder_conviction
    )
  )
