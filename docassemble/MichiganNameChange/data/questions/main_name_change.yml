---
# Checkbox lookups use .get(..., False) so a missing key is treated as unselected
# Temporary: reconsider True allows these three shared values to be recalculated after back-button edits until the review screen exists
# When the review screen is added, remove reconsider True and use targeted recompute entries for these values
id: calculate publication PDF values
reconsider: True
only sets:
  - publication_harms_user_value
  - family_members_harmed_names
  - no_publication_and_basis_of_fear_details_value
code: |
  # Initialize the shared output values and internal working lists
  publication_harms_user_value = False
  family_members_harmed_names = []
  no_publication_detail_parts = []

  # Danger: determine whether the petitioner is endangered and collect non-petitioner names for the dedicated PC51c name fields
  if not publication_is_ok and why_not_publish.get("danger", False):
    danger_for_petitioner = (
      change_petitioner_name and users[0] in publication_danger_people
    )
    publication_harms_user_value = publication_harms_user_value or danger_for_petitioner

    # Danger: collect harmed family members and any separately entered person; exclude the petitioner because PC51c uses separate petitioner fields
    danger_family_names = [
      person.name.full(middle="full")
      for person in publication_danger_people
      if person.instanceName != users[0].instanceName
    ]
    if publication_danger_who.get("someone_else", False):
      danger_family_names.append(publication_danger_someone_else_name)
    family_members_harmed_names.extend(danger_family_names)

    # Danger: initialize the narrative parts for the reasons selected by the user
    danger_parts = []

    if (
      publication_danger_reasons.get("stalking", False)
      or publication_danger_reasons.get("violence", False)
    ):
      # Describe whether the entered incidents involve stalking, physical violence, or both
      if (
        publication_danger_reasons.get("stalking", False)
        and publication_danger_reasons.get("violence", False)
      ):
        danger_type = "physical violence and stalking"
      elif publication_danger_reasons.get("stalking", False):
        danger_type = "stalking"
      else:
        danger_type = "physical violence"

      # Use the generic HotDocs role labels in the narrative because the affected people's names appear in separate PC51c fields
      if danger_for_petitioner and len(danger_family_names) == 1:
        danger_subject = "Petitioner and Endangered Individual"
        danger_subject_verb = "have"
      elif danger_for_petitioner and len(danger_family_names) > 1:
        danger_subject = "Petitioner and Endangered Individuals"
        danger_subject_verb = "have"
      elif danger_for_petitioner:
        danger_subject = "Petitioner"
        danger_subject_verb = "has"
      elif len(danger_family_names) == 1:
        danger_subject = "Endangered Individual"
        danger_subject_verb = "has"
      else:
        danger_subject = "Endangered Individuals"
        danger_subject_verb = "have"

      # Keep the introduction and incidents in one section so the PDF uses consecutive lines rather than blank lines between each item
      incident_subject_verb = "has" if len(publication_incidents) == 1 else "have"
      danger_incident_lines = [
        "{} {} been the subject of {}. The following incident(s) of {} {} occurred.".format(
          danger_subject,
          danger_subject_verb,
          danger_type,
          danger_type,
          incident_subject_verb
        )
      ]

      # Convert a positive integer to the lowercase Roman-numeral style used by the HotDocs form
      def lowercase_roman(number):
        roman_values = (
          (1000, "m"), (900, "cm"), (500, "d"), (400, "cd"),
          (100, "c"), (90, "xc"), (50, "l"), (40, "xl"),
          (10, "x"), (9, "ix"), (5, "v"), (4, "iv"), (1, "i")
        )
        result = ""
        for value, numeral in roman_values:
          while number >= value:
            result += numeral
            number -= value
        return result

      # PDF text fields do not reliably honor tab stops, so use fixed leading spaces to visibly indent each Roman-numeral item
      # Match HotDocs punctuation by removing any trailing periods from the response before adding one final sentence-ending mark
      for incident_number, incident in enumerate(publication_incidents, start=1):
        incident_text = incident.details.strip().rstrip(".").rstrip()
        incident_text = fix_punctuation(incident_text) if incident_text else "."
        danger_incident_lines.append(
          f"    {lowercase_roman(incident_number)}. {incident_text}"
        )

      danger_parts.append("\n".join(danger_incident_lines))

      # Use the same petitioner/family wording variants as HotDocs based on who the user identified as endangered
      if danger_for_petitioner and not danger_family_names:
        danger_find_target = "me"
        danger_identity_possessive = "my"
      elif danger_for_petitioner:
        danger_find_target = "me or my family"
        danger_identity_possessive = "my or my family member's"
      else:
        danger_find_target = "my family"
        danger_identity_possessive = "my family member's"

      # Build one PDF sentence from any future-danger reasons selected by the user
      future_reasons = []

      if publication_danger_future_risk.get("find_family", False):
        future_reasons.append(
          f"it would make it easier for the perpetrator of the past stalking or violence to find {danger_find_target}"
        )

      if publication_danger_future_risk.get("reveal_gender_identity", False):
        future_reasons.append(
          f"it would allow the perpetrator of the past stalking or violence to find out {danger_identity_possessive} gender identity"
        )

      if future_reasons:
        danger_parts.append(
          f"Publication would increase the danger of violence in the future because {comma_and_list(future_reasons)}."
        )

    # Danger: add either the suggested or custom gender-identity statement
    if publication_danger_reasons.get("gender_identity", False):
      if danger_gender_statement_choice == "default":
        danger_parts.append(
          str(danger_gender_default_text).strip()
        )
      else:
        danger_parts.append(
          fix_punctuation(danger_gender_custom_text.strip())
        )

    # Danger: add the user's other danger explanation as a complete sentence
    if publication_danger_reasons.get("other", False):
      danger_parts.append(
        fix_punctuation(
          f"There is a risk of danger if information about this name change is published because {publication_danger_other_reason.strip()}"
        )
      )

    # Danger: combine the completed narrative parts under the danger heading used on PC51c
    no_publication_detail_parts.append(
      "Danger or greater likelihood of physical danger:\n"
      + "\n\n".join(danger_parts)
    )

  # Discrimination: calculate the generic HotDocs role labels used in the narrative
  if not publication_is_ok and why_not_publish.get("discrimination", False):
    discrimination_for_petitioner = (
      change_petitioner_name and users[0] in discrimination_people
    )
    publication_harms_user_value = (
      publication_harms_user_value or discrimination_for_petitioner
    )

    # Discrimination: collect harmed family members and any separately entered person; exclude the petitioner because PC51c uses separate petitioner fields
    discrimination_family_names = [
      person.name.full(middle="full")
      for person in discrimination_people
      if person.instanceName != users[0].instanceName
    ]
    if discrimination_who.get("someone_else", False):
      discrimination_family_names.append(
        discrimination_someone_else_name
      )
    family_members_harmed_names.extend(discrimination_family_names)

    if discrimination_for_petitioner and len(discrimination_family_names) == 1:
      discrimination_subject = "Petitioner and Endangered Individual"
      discrimination_subject_verb = "have"
      discrimination_subject_possessive = "Petitioner's and Endangered Individual's"
    elif discrimination_for_petitioner and len(discrimination_family_names) > 1:
      discrimination_subject = "Petitioner and Endangered Individuals"
      discrimination_subject_verb = "have"
      discrimination_subject_possessive = "Petitioner's and Endangered Individuals'"
    elif discrimination_for_petitioner:
      discrimination_subject = "Petitioner"
      discrimination_subject_verb = "has"
      discrimination_subject_possessive = "Petitioner's"
    elif len(discrimination_family_names) == 1:
      discrimination_subject = "Endangered Individual"
      discrimination_subject_verb = "has"
      discrimination_subject_possessive = "Endangered Individual's"
    else:
      discrimination_subject = "Endangered Individuals"
      discrimination_subject_verb = "have"
      discrimination_subject_possessive = "Endangered Individuals'"

    # Discrimination: initialize the narrative parts for the reasons selected by the user
    discrimination_parts = []

    # Discrimination: describe past discrimination affecting the selected people and explain why publication may worsen it
    if discrimination_reasons.get("past_person", False):
      discrimination_parts.append(
        (
          f"{discrimination_subject} {discrimination_subject_verb} already experienced discrimination. "
          f"{fix_punctuation(discrimination_history_person.strip())} "
          "This discrimination is likely to continue or worsen if a notice is published "
          "or the record of the proceeding is available for access."
        )
      )

    # Discrimination: describe past community discrimination and explain how publication would place the selected people at risk
    if discrimination_reasons.get("past_community", False):
      discrimination_parts.append(
        (
          f"There has been past discrimination against other members of {discrimination_subject_possessive} community. "
          f"{fix_punctuation(discrimination_history_community.strip())} "
          "If a notice is published or the record of the proceeding is available for access, "
          f"{discrimination_subject} will be placed at risk of such discrimination."
        )
      )

    # Discrimination: add either the suggested or custom gender-identity statement
    if discrimination_reasons.get("gender_identity", False):
      if discrimination_gender_statement_choice == "default":
        discrimination_parts.append(
          str(discrimination_gender_default_text).strip()
        )
      else:
        discrimination_parts.append(
          fix_punctuation(discrimination_gender_custom_text.strip())
        )

    # Discrimination: add the additional risk explanation only when the optional follow-up was shown and answered yes
    if showifdef("discrimination_additional", False):
      discrimination_parts.append(
        fix_punctuation(
          f"Publishing information about this name change would increase the risk of discrimination because {discrimination_additional_reason.strip()}"
        )
      )

    # Discrimination: combine the completed narrative parts under the discrimination heading used on PC51c
    no_publication_detail_parts.append(
      "Risk of unlawful discrimination or retaliation:\n"
      + "\n\n".join(discrimination_parts)
    )

  # Final shared data: remove duplicate names when the same person was selected for both danger and discrimination, while preserving first appearance
  family_members_harmed_names = list(
    dict.fromkeys(family_members_harmed_names)
  )

  # Final PC51c PDF value: combine the danger and discrimination sections with a blank line between them
  no_publication_and_basis_of_fear_details_value = "\n\n".join(
    no_publication_detail_parts
  )
---
objects:
  - petition_for_name_change_pc51: ALDocument.using(
      title="Petition for Name Change - PC 51",
      filename="petition_for_name_change_pc_51"
      )
  - petition_for_name_change_pc51c: ALDocument.using(
      title="Petition for Name Change and Ex Parte Request for Nonpublication and Confidential Record - PC 51c",
      filename="petition_for_name_change_and_ex_parte_request_for_nonpublication_and_confidential_record_-_pc_51c"
      )
  - request_hearing_dismissal_pc162: ALDocument.using(
      title="Request for Hearing or Dismissal Regarding Name Change Proceeding - PC 162",
      filename="request_hearing_dismissal_pc162"
      )
  - order_denial_request_nonpublication_pc163: ALDocument.using(
      title="Order After Hearing Regarding Denial of Ex Parte Request for Nonpublication and Confidential Record - PC 163",
      filename="order_denial_request_nonpublication_pc163"
      )
  - minors_consent_to_name_change_pc51b: ALDocument.using(
      title="Minor's Consent to Name Change - PC 51b",
      filename="minors_consent_to_name_change_pc51b"
      )
  - notice_of_hearing_pc562: ALDocument.using(
      title="Notice of Hearing - PC 562",
      filename="notice_of_hearing_pc562"
      )
---
id: enable correct petition for publication choice
depends on:
  - publication_is_ok
code: |
  # Enable only the petition that matches the user's publication choice so the document bundle omits the unused petition
  petition_for_name_change_pc51.enabled = publication_is_ok
  petition_for_name_change_pc51c.enabled = not publication_is_ok
---
objects:
  - al_user_bundle: ALDocumentBundle.using(
      elements=[
        petition_for_name_change_pc51,
        petition_for_name_change_pc51c
      ],
      filename="Michigan Name Change --all forms",
      title="All forms and instructions",
      enabled=True
      )
  - al_court_bundle: ALDocumentBundle.using(
      elements=[
        petition_for_name_change_pc51,
        petition_for_name_change_pc51c
      ],
      filename="Michigan Name Change --all forms",
      title="All forms",
      enabled=True
      )
---
attachment:
  - name: Petition for Name Change
    filename: petition_for_name_change_pc51
    variable name: petition_for_name_change_pc51[i]
    pdf template file: petition_for_name_change_pc51.pdf
    skip undefined: False
    editable: False
    fields:
      # Court and case information
      - trial_court: ${ the_court.number }
      - case_number: ${ "" }
      - trial_court_county: ${ the_court.address.county.upper() }
      - trial_court_address_on_one_line: ${ the_court.address.on_one_line() }
      - trial_court_phone_number: ${ the_court.phone }
      - list_of_users_current_names: ${ comma_and_list([person.name.full(middle="full") for person in people_changing_names]) }

      # Petitioner contact information
      - petitioner_block: |
          ${ users[0].name.full(middle="full") }
          ${ users[0].address.line_one() }
          ${ users[0].address.line_two() }
          ${ phone_number_formatted(users[0].phone_number) }
      # Not used
      - petitioners_attorney_block:

      # Prior family cases
      - has_previous_case: ${ prior_family_cases.there_are_any }
      - previous_case_court: ${ 'See "Confidential Case Inventory"' if prior_family_cases.there_are_any else "" }
      # Not used (these aren't filled out in LHI since everything is treated as confidential)
      - previous_case_number:
      - judge:
      - previously_filed_case_remains_pending:
      - previously_filed_case_no_longer_pending:

      # People included in the name change request
      - name_change_for: ${ True }
      - name_change_for_married_user: ${ (change_petitioner_name and change_children_names) or change_spouse_name }
      - name_change_for_spouse: ${ change_spouse_name }
      - name_change_for_minor_children: ${ change_petitioner_name and change_children_names }
      - name_change_for_adult_only: ${ change_petitioner_name and not change_spouse_name and not change_children_names and (not petitioner_is_minor or emancipated_minor) }
      - emancipated_minor_note: ${ "(Emancipated minor)" if petitioner_is_minor and emancipated_minor else "" }
      - name_change_for_minor_only: ${ (petitioner_is_minor and not emancipated_minor) or (change_children_names and not change_petitioner_name) }
      - includes_request_for_minor: ${ (petitioner_is_minor and not emancipated_minor) or change_children_names }

      # Parent and guardian information for a minor name change
      - first_parent_name: ${ (minor_parent_one.name.full(middle="full") + (" - Deceased" if not minor_parent_one.is_alive else "")) if ((petitioner_is_minor and not emancipated_minor) or (change_children_names and petitioner_relationship_to_children == "guardian")) else (users[0].name.full(middle="full") if change_children_names and petitioner_relationship_to_children == "biological" else "") }
      - first_parent_is_deceased: ${ ((petitioner_is_minor and not emancipated_minor) or (change_children_names and petitioner_relationship_to_children == "guardian")) and not minor_parent_one.is_alive }

      # A participating spouse is alive and agreeing for form purposes without defining skipped parent-status answers.
      - second_parent_name: ${ (minor_parent_two.name.full(middle="full") + (" - Deceased" if not minor_parent_two.is_alive else "")) if ((petitioner_is_minor and not emancipated_minor) or (change_children_names and petitioner_relationship_to_children == "guardian")) else ((children_other_parent.name.full(middle="full") + (" - Deceased" if children_other_parent_questions_needed and not children_other_parent.is_alive else "")) if change_children_names and petitioner_relationship_to_children == "biological" else "") }
      - second_parent_is_deceased: ${ (((petitioner_is_minor and not emancipated_minor) or (change_children_names and petitioner_relationship_to_children == "guardian")) and not minor_parent_two.is_alive) or (change_children_names and petitioner_relationship_to_children == "biological" and children_other_parent_questions_needed and not children_other_parent.is_alive) }
      - minor_guardian_name: ${ users[0].name.full(middle="full") if change_children_names and petitioner_relationship_to_children == "guardian" else (minor_guardian.name.full(middle="full") if petitioner_is_minor and not emancipated_minor and minor_first_signing_parent is minor_guardian else "") }

      # Not used (LHI and interview currently do not handle mentally incompetent parents)
      - mentally_incompetent_parent_guardian:

      # Consent for a minor name change
      - minor_consent: ${ (petitioner_is_minor and not emancipated_minor) or change_children_names }
      - consent_parents_jointly: ${ ((petitioner_is_minor and not emancipated_minor) and minor_parent_one.is_alive and minor_parent_two.is_alive and minor_parent_one.agrees_to_name_change and minor_parent_two.agrees_to_name_change) or (change_children_names and petitioner_relationship_to_children == "biological" and (not children_other_parent_questions_needed or (children_other_parent.is_alive and children_other_parent.agrees_to_name_change))) }
      - consent_sole_surviving_parent: ${ ((petitioner_is_minor and not emancipated_minor) and ((minor_parent_one.is_alive and minor_parent_one.agrees_to_name_change and not minor_parent_two.is_alive) or (minor_parent_two.is_alive and minor_parent_two.agrees_to_name_change and not minor_parent_one.is_alive))) or (change_children_names and petitioner_relationship_to_children == "biological" and children_other_parent_questions_needed and not children_other_parent.is_alive) }
      - consent_only_available_parent: ${ ((petitioner_is_minor and not emancipated_minor) and ((minor_parent_one.is_alive and minor_parent_one.has_legal_custody and minor_parent_one.agrees_to_name_change and (not minor_parent_two.is_alive or not minor_parent_two.has_legal_custody)) or (minor_parent_two.is_alive and minor_parent_two.has_legal_custody and minor_parent_two.agrees_to_name_change and (not minor_parent_one.is_alive or not minor_parent_one.has_legal_custody)))) or (change_children_names and petitioner_relationship_to_children == "biological" and children_other_parent_questions_needed and (not children_other_parent.is_alive or not children_other_parent.has_joint_legal_custody)) }
      - consent_guardian: ${ (change_children_names and petitioner_relationship_to_children == "guardian") or ((petitioner_is_minor and not emancipated_minor) and minor_first_signing_parent is minor_guardian) }

      # Not used (LHI and interview currently do not handle mentally incompetent parents)
      - consent_guardian_of_mentally_incompetent_parent:

      # Reason for name change
      - reason_for_name_change: ${ "" if petitioner_is_minor and emancipated_minor else reason_for_name_change }

      # Petitioner criminal records
      - petitioner_has_criminal_record: ${ change_petitioner_name and "petitioner" in people_with_criminal_records.true_values() }
      - petitioner_no_criminal_record: ${ change_petitioner_name and "petitioner" not in people_with_criminal_records.true_values() }
      - petitioner_criminal_record: ${ "; ".join("{} ({})".format(record.charge, record.date) for record in criminal_records if record.person == "petitioner") if change_petitioner_name and "petitioner" in people_with_criminal_records.true_values() else "" }
      - petitioner_has_spouse_or_child: ${ change_spouse_name or change_children_names }

      # Spouse and children criminal records
      # Ignore a criminal-record checkbox selection for a spouse or children who are no longer included after review.
      - spouse_or_child_no_criminal_record: >-
          ${ (change_spouse_name or change_children_names) and not (
            (change_spouse_name and "spouse" in people_with_criminal_records.true_values())
            or (change_children_names and "minor_child" in people_with_criminal_records.true_values())
          ) }
      - spouse_or_child_has_criminal_record: >-
          ${ (change_spouse_name and "spouse" in people_with_criminal_records.true_values())
          or (change_children_names and "minor_child" in people_with_criminal_records.true_values()) }
      - spouse_or_child_criminal_record: >-
          ${ "; ".join(
          "{}: {}".format(label, "; ".join("{} ({})".format(record.charge, record.date) for record in criminal_records if record.person == subject))
          for subject, label, is_included in (("spouse", "Spouse", change_spouse_name), ("minor_child", "A minor child", change_children_names))
          if is_included and subject in people_with_criminal_records.true_values() and any(record.person == subject for record in criminal_records)
          ) }

      # Not used
      - case_number__1:

      # Exceptions to parental consent
      - consent_from_custodial_parent: >-
          ${ (
            petitioner_is_minor
            and not emancipated_minor
            and (
              minor_parent_one.consent_exception_applies
              or minor_parent_two.consent_exception_applies
            )
          ) or (
            change_children_names
            and petitioner_relationship_to_children == "biological"
            and children_other_parent_questions_needed
            and children_other_parent.consent_exception_applies
          ) }
      - noncustodial_parent_failed_to_have_relationship: >-
          ${ (
            (petitioner_is_minor and not emancipated_minor)
            and any(
              parent.is_alive
              and not parent.has_legal_custody
              and not parent.agrees_to_name_change
              and parent.failed_contact_two_years
              for parent in (minor_parent_one, minor_parent_two)
            )
          ) or (
            change_children_names
            and petitioner_relationship_to_children == "biological"
            and children_other_parent_questions_needed
            and children_other_parent.is_alive
            and not children_other_parent.has_joint_legal_custody
            and not children_other_parent.agrees_to_name_change
            and children_other_parent.failed_contact_two_years
          ) }
      - noncustodial_parent_failed_to_comply_with_support_order: >-
          ${ (
            (petitioner_is_minor and not emancipated_minor)
            and any(
              parent.is_alive
              and not parent.has_legal_custody
              and not parent.agrees_to_name_change
              and parent.failed_contact_two_years
              and parent.support_failure_type == "support_order"
              for parent in (minor_parent_one, minor_parent_two)
            )
          ) or (
            change_children_names
            and petitioner_relationship_to_children == "biological"
            and children_other_parent_questions_needed
            and children_other_parent.is_alive
            and not children_other_parent.has_joint_legal_custody
            and not children_other_parent.agrees_to_name_change
            and children_other_parent.failed_contact_two_years
            and children_other_parent.support_failure_type == "support_order"
          ) }
      - noncustodial_parent_failed_to_provide_support_without_order: >-
          ${ (
            (petitioner_is_minor and not emancipated_minor)
            and any(
              parent.is_alive
              and not parent.has_legal_custody
              and not parent.agrees_to_name_change
              and parent.failed_contact_two_years
              and parent.support_failure_type == "no_support_order"
              for parent in (minor_parent_one, minor_parent_two)
            )
          ) or (
            change_children_names
            and petitioner_relationship_to_children == "biological"
            and children_other_parent_questions_needed
            and children_other_parent.is_alive
            and not children_other_parent.has_joint_legal_custody
            and not children_other_parent.agrees_to_name_change
            and children_other_parent.failed_contact_two_years
            and children_other_parent.support_failure_type == "no_support_order"
          ) }
      - noncustodial_parent_has_abuse_conviction: >-
          ${ (
            (petitioner_is_minor and not emancipated_minor)
            and any(
              parent.is_alive
              and not parent.has_legal_custody
              and not parent.agrees_to_name_change
              and parent.abuse_conviction
              for parent in (minor_parent_one, minor_parent_two)
            )
          ) or (
            change_children_names
            and petitioner_relationship_to_children == "biological"
            and children_other_parent_questions_needed
            and children_other_parent.is_alive
            and not children_other_parent.has_joint_legal_custody
            and not children_other_parent.agrees_to_name_change
            and children_other_parent.abuse_conviction
          ) }
      - noncustodial_parent_has_murder_conviction: >-
          ${ (
            (petitioner_is_minor and not emancipated_minor)
            and any(
              parent.is_alive
              and not parent.has_legal_custody
              and not parent.agrees_to_name_change
              and parent.murder_conviction
              for parent in (minor_parent_one, minor_parent_two)
            )
          ) or (
            change_children_names
            and petitioner_relationship_to_children == "biological"
            and children_other_parent_questions_needed
            and children_other_parent.is_alive
            and not children_other_parent.has_joint_legal_custody
            and not children_other_parent.agrees_to_name_change
            and children_other_parent.murder_conviction
          ) }

      # Current and new names
      - petitioner_old_first_name: ${ users[0].name.first if change_petitioner_name else "" }
      - petitioner_old_middle_name: ${ users[0].name.middle if change_petitioner_name else "" }
      - petitioner_old_last_name: ${ (users[0].name.last + (", " + users[0].name.suffix if users[0].name.suffix else "")) if change_petitioner_name else "" }
      - petitioner_new_first_name: ${ users[0].new_name.first if change_petitioner_name else "" }
      - petitioner_new_middle_name: ${ users[0].new_name.middle if change_petitioner_name else "" }
      - petitioner_new_last_name: ${ (users[0].new_name.last + (", " + users[0].new_name.suffix if users[0].new_name.suffix else "")) if change_petitioner_name else "" }

      - spouse_old_first_name: ${ spouse.name.first if change_spouse_name else "" }
      - spouse_old_middle_name: ${ spouse.name.middle if change_spouse_name else "" }
      - spouse_old_last_name: ${ (spouse.name.last + (", " + spouse.name.suffix if spouse.name.suffix else "")) if change_spouse_name else "" }
      - spouse_new_first_name: ${ spouse.new_name.first if change_spouse_name else "" }
      - spouse_new_middle_name: ${ spouse.new_name.middle if change_spouse_name else "" }
      - spouse_new_last_name: ${ (spouse.new_name.last + (", " + spouse.new_name.suffix if spouse.new_name.suffix else "")) if change_spouse_name else "" }

      - minor_child1_old_first_name: ${ children[0].name.first if change_children_names and len(children) > 0 else "" }
      - minor_child1_old_middle_name: ${ children[0].name.middle if change_children_names and len(children) > 0 else "" }
      - minor_child1_old_last_name: ${ (children[0].name.last + (", " + children[0].name.suffix if children[0].name.suffix else "")) if change_children_names and len(children) > 0 else "" }
      - minor_child1_new_first_name: ${ children[0].new_name.first if change_children_names and len(children) > 0 else "" }
      - minor_child1_new_middle_name: ${ children[0].new_name.middle if change_children_names and len(children) > 0 else "" }
      - minor_child1_new_last_name: ${ (children[0].new_name.last + (", " + children[0].new_name.suffix if children[0].new_name.suffix else "")) if change_children_names and len(children) > 0 else "" }

      - minor_child2_old_first_name: ${ children[1].name.first if change_children_names and len(children) > 1 else "" }
      - minor_child2_old_middle_name: ${ children[1].name.middle if change_children_names and len(children) > 1 else "" }
      - minor_child2_old_last_name: ${ (children[1].name.last + (", " + children[1].name.suffix if children[1].name.suffix else "")) if change_children_names and len(children) > 1 else "" }
      - minor_child2_new_first_name: ${ children[1].new_name.first if change_children_names and len(children) > 1 else "" }
      - minor_child2_new_middle_name: ${ children[1].new_name.middle if change_children_names and len(children) > 1 else "" }
      - minor_child2_new_last_name: ${ (children[1].new_name.last + (", " + children[1].new_name.suffix if children[1].new_name.suffix else "")) if change_children_names and len(children) > 1 else "" }

      # Birth certificate request
      # Keep item 11 and its name line consistent if review removes the only person selected for a replacement birth certificate that hides the former name.
      - wants_new_birth_certifcate: ${ birth_certificate_option == "option_two" and any(person in people_changing_names for person in people_for_sealed_birth_certificate) }
      # Ignore any stale object-checkbox selection left after a person is removed during review.
      - new_birth_certificate_sealed_names: ${ comma_and_list([person.name.full(middle="full") for person in people_for_sealed_birth_certificate if person in people_changing_names]) if birth_certificate_option == "option_two" else "" }

      # Petitioner signature
      - signature_date: ${ format_date(signature_date, format="MM/dd/yyyy") if MLH_esign and MLH_esign_supported else "" }
      - petitioner_signature: |
          % if MLH_esign and MLH_esign_supported:
          /s/ ${ users[0].name.full(middle="full") }
          % else:
          ${ "" }
          % endif
      - petitioner_signature_esign_cite: ${ MLH_esign_tag if MLH_esign and MLH_esign_supported else "" }
      - attorney_signature: ${ "Self-represented" }
      - case_number__2:

      # Parent or guardian consent signatures (used when changing children's names)
      - first_parent_or_guardian_signature_date: ${ format_date(signature_date, format="MM/dd/yyyy") if change_children_names and MLH_esign and MLH_esign_supported else "" }
      - first_parent_or_guardian_signature: |
          % if change_children_names and MLH_esign and MLH_esign_supported:
          /s/ ${ users[0].name.full(middle="full") }
          % else:
          ${ "" }
          % endif
      - first_parent_signature_esign_cite: ${ MLH_esign_tag if change_children_names and MLH_esign and MLH_esign_supported else "" }
      - first_parent_or_guardian_name: ${ users[0].name.full(middle="full") if change_children_names else (minor_first_signing_parent.name.full(middle="full") if (petitioner_is_minor and not emancipated_minor) else "") }
      - first_parent_or_guardian_address_line_one: |
          % if change_children_names:
          ${ users[0].address.line_one() }
          % elif petitioner_is_minor and not emancipated_minor:
          ${ minor_first_signing_parent.address.line_one() }
          % endif
      - first_parent_or_guardian_address_line_two: |
          % if change_children_names:
          ${ users[0].address.line_two() }
          % elif petitioner_is_minor and not emancipated_minor:
          ${ minor_first_signing_parent.address.line_two() }
          % endif
      - first_parent_or_guardian_phone_number: ${ phone_number_formatted(users[0].phone_number) if change_children_names else (phone_number_formatted(minor_first_signing_parent.phone_number) if (petitioner_is_minor and not emancipated_minor) and minor_first_signing_parent.phone_number else "") }

      # A participating spouse supplies the second parent signature information without requiring skipped parent-status answers.
      - second_parent_or_guardian_name: ${ children_other_parent.name.full(middle="full") if change_children_names and petitioner_relationship_to_children == "biological" and (not children_other_parent_questions_needed or (children_other_parent.is_alive and children_other_parent.agrees_to_name_change)) else (minor_second_signing_parent.name.full(middle="full") if (petitioner_is_minor and not emancipated_minor) and minor_second_signing_parent else "") }
      - second_parent_or_guardian_address_line_one: |
          % if change_children_names and petitioner_relationship_to_children == "biological" and not children_other_parent_questions_needed:
          ${ users[0].address.line_one() if spouse_address_same_as_user else spouse.address.line_one() }
          % elif change_children_names and petitioner_relationship_to_children == "biological" and children_other_parent_questions_needed and children_other_parent.is_alive and children_other_parent.whereabouts_known and children_other_parent.agrees_to_name_change:
          ${ users[0].address.line_one() if other_parent.address_same_as_user else other_parent.address.line_one() }
          % elif (petitioner_is_minor and not emancipated_minor) and minor_second_signing_parent:
          ${ minor_second_signing_parent.address.line_one() }
          % endif
      - second_parent_or_guardian_address_line_two: |
          % if change_children_names and petitioner_relationship_to_children == "biological" and not children_other_parent_questions_needed:
          ${ users[0].address.line_two() if spouse_address_same_as_user else spouse.address.line_two() }
          % elif change_children_names and petitioner_relationship_to_children == "biological" and children_other_parent_questions_needed and children_other_parent.is_alive and children_other_parent.whereabouts_known and children_other_parent.agrees_to_name_change:
          ${ users[0].address.line_two() if other_parent.address_same_as_user else other_parent.address.line_two() }
          % elif (petitioner_is_minor and not emancipated_minor) and minor_second_signing_parent:
          ${ minor_second_signing_parent.address.line_two() }
          % endif
      - second_parent_or_guardian_phone_number: |
          % if change_children_names and petitioner_relationship_to_children == "biological" and not children_other_parent_questions_needed and spouse.phone_number:
          ${ phone_number_formatted(spouse.phone_number) }
          % elif change_children_names and petitioner_relationship_to_children == "biological" and children_other_parent_questions_needed and children_other_parent.is_alive and children_other_parent.whereabouts_known and children_other_parent.agrees_to_name_change and other_parent.phone_number:
          ${ phone_number_formatted(other_parent.phone_number) }
          % elif (petitioner_is_minor and not emancipated_minor) and minor_second_signing_parent and minor_second_signing_parent.phone_number:
          ${ phone_number_formatted(minor_second_signing_parent.phone_number) }
          % endif

      # Spouse information (appears when spouse name is changing)
      - consenting_spouse_name: ${ spouse.name.full(middle="full") if change_spouse_name else "" }
      - consenting_spouse_address_line_one: ${ (users[0].address.line_one() if spouse_address_same_as_user else spouse.address.line_one()) if change_spouse_name else "" }
      - consenting_spouse_address_line_two: ${ (users[0].address.line_two() if spouse_address_same_as_user else spouse.address.line_two()) if change_spouse_name else "" }
      - consenting_spouse_phone_number: ${ spouse.phone_numbers() if change_spouse_name else "" }

      # Attorney information (not used)
      - attorney_signature__1:
      - attorney_name:
      - attorney_bar_number:
      - attorney_address_line_one:
      - attorney_address_line_two:
      - attorney_phone_number:

      # Minor consent signature (appears when petitioner is an unemancipated minor)
      - consenting_minor1_signature_date: ${ format_date(signature_date, format="MM/dd/yyyy") if petitioner_is_minor and not emancipated_minor and MLH_esign and MLH_esign_supported else "" }
      - consenting_minor1_signature: ${ "/s/ " + users[0].name.full(middle="full") if petitioner_is_minor and not emancipated_minor and MLH_esign and MLH_esign_supported else "" }
      - minor_signature_esign_cite: ${ MLH_esign_tag if petitioner_is_minor and not emancipated_minor and MLH_esign and MLH_esign_supported else "" }
      - consenting_minor1_name: ${ users[0].name.full(middle="full") if petitioner_is_minor and not emancipated_minor else "" }

      # Not used
      - consenting_minor2_name:
---
attachment:
  - name: Petition for Name Change and Ex Parte Request for Nonpublication and Confidential Record - PC 51c
    filename: petition_for_name_change_pc51c
    variable name: petition_for_name_change_pc51c[i]
    pdf template file: petition_for_name_change_pc51c.pdf
    skip undefined: False
    editable: False
    fields:
      # Court and case information
      - trial_court: ${ the_court.number }
      - case_number:
      - trial_court_county: ${ the_court.address.county.upper() }
      - trial_court_address_on_one_line: ${ the_court.address.on_one_line() }
      - trial_court_phone_number: ${ the_court.phone }
      - list_of_users_current_names: ${ comma_and_list([person.name.full(middle="full") for person in people_changing_names]) }

      # Petitioner contact information
      - petitioner_block: |
          ${ users[0].name.full(middle="full") }
          ${ users[0].address.line_one() }
          ${ users[0].address.line_two() }
          ${ phone_number_formatted(users[0].phone_number) }
      # Not used
      - petitioners_attorney_block:

      # Prior family cases
      - has_previous_case: ${ prior_family_cases.there_are_any }
      - previous_case_court: ${ 'See "Confidential Case Inventory"' if prior_family_cases.there_are_any else "" }
      # Not used (these aren't filled out in LHI since everything is treated as confidential)
      - previous_case_number:
      - judge:
      - previously_filed_case_remains_pending:
      - previously_filed_case_no_longer_pending:

      # People included in the name change request
      - name_change_for: ${ True }
      - name_change_for_married_user: ${ (change_petitioner_name and change_children_names) or change_spouse_name }
      - name_change_for_spouse: ${ change_spouse_name }
      - name_change_for_minor_children: ${ change_petitioner_name and change_children_names }
      - name_change_for_adult_only: ${ change_petitioner_name and not change_spouse_name and not change_children_names and (not petitioner_is_minor or emancipated_minor) }
      - emancipated_minor_note: ${ "(Emancipated minor)" if petitioner_is_minor and emancipated_minor else "" }
      - name_change_for_minor_only: ${ (petitioner_is_minor and not emancipated_minor) or (change_children_names and not change_petitioner_name) }
      - includes_request_for_minor: ${ (petitioner_is_minor and not emancipated_minor) or change_children_names }

      # Parent and guardian information for a minor name change
      - first_parent_name: ${ (minor_parent_one.name.full(middle="full") + (" - Deceased" if not minor_parent_one.is_alive else "")) if ((petitioner_is_minor and not emancipated_minor) or (change_children_names and petitioner_relationship_to_children == "guardian")) else (users[0].name.full(middle="full") if change_children_names and petitioner_relationship_to_children == "biological" else "") }
      - first_parent_is_deceased: ${ ((petitioner_is_minor and not emancipated_minor) or (change_children_names and petitioner_relationship_to_children == "guardian")) and not minor_parent_one.is_alive }

      # A participating spouse is alive and agreeing for form purposes without defining skipped parent-status answers.
      - second_parent_name: ${ (minor_parent_two.name.full(middle="full") + (" - Deceased" if not minor_parent_two.is_alive else "")) if ((petitioner_is_minor and not emancipated_minor) or (change_children_names and petitioner_relationship_to_children == "guardian")) else ((children_other_parent.name.full(middle="full") + (" - Deceased" if children_other_parent_questions_needed and not children_other_parent.is_alive else "")) if change_children_names and petitioner_relationship_to_children == "biological" else "") }
      - second_parent_is_deceased: ${ (((petitioner_is_minor and not emancipated_minor) or (change_children_names and petitioner_relationship_to_children == "guardian")) and not minor_parent_two.is_alive) or (change_children_names and petitioner_relationship_to_children == "biological" and children_other_parent_questions_needed and not children_other_parent.is_alive) }
      - minor_guardian_name: ${ users[0].name.full(middle="full") if change_children_names and petitioner_relationship_to_children == "guardian" else (minor_guardian.name.full(middle="full") if petitioner_is_minor and not emancipated_minor and minor_first_signing_parent is minor_guardian else "") }

      # Not used (LHI and interview currently do not handle mentally incompetent parents) 
      - mentally_incompetent_parent_guardian:

      # Consent for a minor name change
      - minor_consent: ${ (petitioner_is_minor and not emancipated_minor) or change_children_names }
      - consent_parents_jointly: ${ ((petitioner_is_minor and not emancipated_minor) and minor_parent_one.is_alive and minor_parent_two.is_alive and minor_parent_one.agrees_to_name_change and minor_parent_two.agrees_to_name_change) or (change_children_names and petitioner_relationship_to_children == "biological" and (not children_other_parent_questions_needed or (children_other_parent.is_alive and children_other_parent.agrees_to_name_change))) }
      - consent_sole_surviving_parent: ${ ((petitioner_is_minor and not emancipated_minor) and ((minor_parent_one.is_alive and minor_parent_one.agrees_to_name_change and not minor_parent_two.is_alive) or (minor_parent_two.is_alive and minor_parent_two.agrees_to_name_change and not minor_parent_one.is_alive))) or (change_children_names and petitioner_relationship_to_children == "biological" and children_other_parent_questions_needed and not children_other_parent.is_alive) }
      - consent_only_available_parent: ${ ((petitioner_is_minor and not emancipated_minor) and ((minor_parent_one.is_alive and minor_parent_one.has_legal_custody and minor_parent_one.agrees_to_name_change and (not minor_parent_two.is_alive or not minor_parent_two.has_legal_custody)) or (minor_parent_two.is_alive and minor_parent_two.has_legal_custody and minor_parent_two.agrees_to_name_change and (not minor_parent_one.is_alive or not minor_parent_one.has_legal_custody)))) or (change_children_names and petitioner_relationship_to_children == "biological" and children_other_parent_questions_needed and (not children_other_parent.is_alive or not children_other_parent.has_joint_legal_custody)) }
      - consent_guardian: ${ (change_children_names and petitioner_relationship_to_children == "guardian") or ((petitioner_is_minor and not emancipated_minor) and minor_first_signing_parent is minor_guardian) }
        
      # Not used (LHI and interview currently do not handle mentally incompetent parents)  
      - consent_guardian_of_mentally_incompetent_parent:

      # Reason for name change
      - reason_for_name_change: ${ "" if petitioner_is_minor and emancipated_minor else reason_for_name_change }

      # Petitioner criminal records
      - petitioner_has_criminal_record: ${ change_petitioner_name and "petitioner" in people_with_criminal_records.true_values() }
      - petitioner_no_criminal_record: ${ change_petitioner_name and "petitioner" not in people_with_criminal_records.true_values() }
      - petitioner_criminal_record: ${ "; ".join("{} ({})".format(record.charge, record.date) for record in criminal_records if record.person == "petitioner") if change_petitioner_name and "petitioner" in people_with_criminal_records.true_values() else "" }
      - petitioner_has_spouse_or_child: ${ change_spouse_name or change_children_names }

      # Spouse and children criminal records
      # Ignore a criminal-record checkbox selection for a spouse or children who are no longer included after review.
      - spouse_or_child_no_criminal_record: >-
          ${ (change_spouse_name or change_children_names) and not (
            (change_spouse_name and "spouse" in people_with_criminal_records.true_values())
            or (change_children_names and "minor_child" in people_with_criminal_records.true_values())
          ) }
      - spouse_or_child_has_criminal_record: >-
          ${ (change_spouse_name and "spouse" in people_with_criminal_records.true_values())
          or (change_children_names and "minor_child" in people_with_criminal_records.true_values()) }
      - spouse_or_child_criminal_record: >-
          ${ "; ".join(
          "{}: {}".format(label, "; ".join("{} ({})".format(record.charge, record.date) for record in criminal_records if record.person == subject))
          for subject, label, is_included in (("spouse", "Spouse", change_spouse_name), ("minor_child", "A minor child", change_children_names))
          if is_included and subject in people_with_criminal_records.true_values() and any(record.person == subject for record in criminal_records)
          ) }

      # Not used
      - case_number__1:

      # Exceptions to parental consent
      - consent_from_custodial_parent: >-
          ${ (
            petitioner_is_minor
            and not emancipated_minor
            and (
              minor_parent_one.consent_exception_applies
              or minor_parent_two.consent_exception_applies
            )
          ) or (
            change_children_names
            and petitioner_relationship_to_children == "biological"
            and children_other_parent_questions_needed
            and children_other_parent.consent_exception_applies
          ) }
      - noncustodial_parent_failed_to_have_relationship: >-
          ${ (
            (petitioner_is_minor and not emancipated_minor)
            and any(
              parent.is_alive
              and not parent.has_legal_custody
              and not parent.agrees_to_name_change
              and parent.failed_contact_two_years
              for parent in (minor_parent_one, minor_parent_two)
            )
          ) or (
            change_children_names
            and petitioner_relationship_to_children == "biological"
            and children_other_parent_questions_needed
            and children_other_parent.is_alive
            and not children_other_parent.has_joint_legal_custody
            and not children_other_parent.agrees_to_name_change
            and children_other_parent.failed_contact_two_years
          ) }
      - noncustodial_parent_failed_to_comply_with_support_order: >-
          ${ (
            (petitioner_is_minor and not emancipated_minor)
            and any(
              parent.is_alive
              and not parent.has_legal_custody
              and not parent.agrees_to_name_change
              and parent.failed_contact_two_years
              and parent.support_failure_type == "support_order"
              for parent in (minor_parent_one, minor_parent_two)
            )
          ) or (
            change_children_names
            and petitioner_relationship_to_children == "biological"
            and children_other_parent_questions_needed
            and children_other_parent.is_alive
            and not children_other_parent.has_joint_legal_custody
            and not children_other_parent.agrees_to_name_change
            and children_other_parent.failed_contact_two_years
            and children_other_parent.support_failure_type == "support_order"
          ) }
      - noncustodial_parent_failed_to_provide_support_without_order: >-
          ${ (
            (petitioner_is_minor and not emancipated_minor)
            and any(
              parent.is_alive
              and not parent.has_legal_custody
              and not parent.agrees_to_name_change
              and parent.failed_contact_two_years
              and parent.support_failure_type == "no_support_order"
              for parent in (minor_parent_one, minor_parent_two)
            )
          ) or (
            change_children_names
            and petitioner_relationship_to_children == "biological"
            and children_other_parent_questions_needed
            and children_other_parent.is_alive
            and not children_other_parent.has_joint_legal_custody
            and not children_other_parent.agrees_to_name_change
            and children_other_parent.failed_contact_two_years
            and children_other_parent.support_failure_type == "no_support_order"
          ) }
      - noncustodial_parent_has_abuse_conviction: >-
          ${ (
            (petitioner_is_minor and not emancipated_minor)
            and any(
              parent.is_alive
              and not parent.has_legal_custody
              and not parent.agrees_to_name_change
              and parent.abuse_conviction
              for parent in (minor_parent_one, minor_parent_two)
            )
          ) or (
            change_children_names
            and petitioner_relationship_to_children == "biological"
            and children_other_parent_questions_needed
            and children_other_parent.is_alive
            and not children_other_parent.has_joint_legal_custody
            and not children_other_parent.agrees_to_name_change
            and children_other_parent.abuse_conviction
          ) }
      - noncustodial_parent_has_murder_conviction: >-
          ${ (
            (petitioner_is_minor and not emancipated_minor)
            and any(
              parent.is_alive
              and not parent.has_legal_custody
              and not parent.agrees_to_name_change
              and parent.murder_conviction
              for parent in (minor_parent_one, minor_parent_two)
            )
          ) or (
            change_children_names
            and petitioner_relationship_to_children == "biological"
            and children_other_parent_questions_needed
            and children_other_parent.is_alive
            and not children_other_parent.has_joint_legal_custody
            and not children_other_parent.agrees_to_name_change
            and children_other_parent.murder_conviction
          ) }

      # Current and new names
      - petitioner_old_first_name: ${ users[0].name.first if change_petitioner_name else "" }
      - petitioner_old_middle_name: ${ users[0].name.middle if change_petitioner_name else "" }
      - petitioner_old_last_name: ${ (users[0].name.last + (", " + users[0].name.suffix if users[0].name.suffix else "")) if change_petitioner_name else "" }
      - petitioner_new_first_name: ${ users[0].new_name.first if change_petitioner_name else "" }
      - petitioner_new_middle_name: ${ users[0].new_name.middle if change_petitioner_name else "" }
      - petitioner_new_last_name: ${ (users[0].new_name.last + (", " + users[0].new_name.suffix if users[0].new_name.suffix else "")) if change_petitioner_name else "" }
      - spouse_old_first_name: ${ spouse.name.first if change_spouse_name else "" }
      - spouse_old_middle_name: ${ spouse.name.middle if change_spouse_name else "" }
      - spouse_old_last_name: ${ (spouse.name.last + (", " + spouse.name.suffix if spouse.name.suffix else "")) if change_spouse_name else "" }
      - spouse_new_first_name: ${ spouse.new_name.first if change_spouse_name else "" }
      - spouse_new_middle_name: ${ spouse.new_name.middle if change_spouse_name else "" }
      - spouse_new_last_name: ${ (spouse.new_name.last + (", " + spouse.new_name.suffix if spouse.new_name.suffix else "")) if change_spouse_name else "" }
        
      - minor_child1_old_first_name: ${ children[0].name.first if change_children_names and len(children) > 0 else "" }
      - minor_child1_old_middle_name: ${ children[0].name.middle if change_children_names and len(children) > 0 else "" }
      - minor_child1_old_last_name: ${ (children[0].name.last + (", " + children[0].name.suffix if children[0].name.suffix else "")) if change_children_names and len(children) > 0 else "" }
      - minor_child1_new_first_name: ${ children[0].new_name.first if change_children_names and len(children) > 0 else "" }
      - minor_child1_new_middle_name: ${ children[0].new_name.middle if change_children_names and len(children) > 0 else "" }
      - minor_child1_new_last_name: ${ (children[0].new_name.last + (", " + children[0].new_name.suffix if children[0].new_name.suffix else "")) if change_children_names and len(children) > 0 else "" }
        
      - minor_child2_old_first_name: ${ children[1].name.first if change_children_names and len(children) > 1 else "" }
      - minor_child2_old_middle_name: ${ children[1].name.middle if change_children_names and len(children) > 1 else "" }
      - minor_child2_old_last_name: ${ (children[1].name.last + (", " + children[1].name.suffix if children[1].name.suffix else "")) if change_children_names and len(children) > 1 else "" }
      - minor_child2_new_first_name: ${ children[1].new_name.first if change_children_names and len(children) > 1 else "" }
      - minor_child2_new_middle_name: ${ children[1].new_name.middle if change_children_names and len(children) > 1 else "" }
      - minor_child2_new_last_name: ${ (children[1].new_name.last + (", " + children[1].new_name.suffix if children[1].new_name.suffix else "")) if change_children_names and len(children) > 1 else "" }
        
      - minor_child3_old_first_name: ${ children[2].name.first if change_children_names and len(children) > 2 else "" }
      - minor_child3_old_middle_name: ${ children[2].name.middle if change_children_names and len(children) > 2 else "" }
      - minor_child3_old_last_name: ${ (children[2].name.last + (", " + children[2].name.suffix if children[2].name.suffix else "")) if change_children_names and len(children) > 2 else "" }
      - minor_child3_new_first_name: ${ children[2].new_name.first if change_children_names and len(children) > 2 else "" }
      - minor_child3_new_middle_name: ${ children[2].new_name.middle if change_children_names and len(children) > 2 else "" }
      - minor_child3_new_last_name: ${ (children[2].new_name.last + (", " + children[2].new_name.suffix if children[2].new_name.suffix else "")) if change_children_names and len(children) > 2 else "" }

      # Birth certificate request
      # Keep item 11 and its name line consistent if review removes the only person selected for a replacement birth certificate that hides the former name.
      - wants_new_birth_certifcate: ${ birth_certificate_option == "option_two" and any(person in people_changing_names for person in people_for_sealed_birth_certificate) }
      # Ignore any stale object-checkbox selection left after a person is removed during review.
      - new_birth_certificate_sealed_names: ${ comma_and_list([person.name.full(middle="full") for person in people_for_sealed_birth_certificate if person in people_changing_names]) if birth_certificate_option == "option_two" else "" }

      # Petitioner signature
      - signature_date: ${ format_date(signature_date, format="MM/dd/yyyy") if MLH_esign and MLH_esign_supported else "" }
      - petitioner_signature: |
          % if MLH_esign and MLH_esign_supported:
          /s/ ${ users[0].name.full(middle="full") }
          % else:
          ${ "" }
          % endif
      - petitioner_signature_esign_cite: ${ MLH_esign_tag if MLH_esign and MLH_esign_supported else "" }
      - attorney_signature: ${ "Self-represented" }
      - case_number__2:

      # Nonpublication request and basis of fear
      - no_publication_of_notice: ${ not publication_is_ok }
      - publication_harms_user: ${ publication_harms_user_value }
      - publication_harms_family_members: ${ bool(family_members_harmed_names) }
      - family_members_harmed_by_publication: ${ ", ".join(family_members_harmed_names) }
      - publication_has_physical_danger: ${ not publication_is_ok and why_not_publish["danger"] }
      - publication_has_discrimination_or_retaliation: ${ not publication_is_ok and why_not_publish["discrimination"] }
      - no_publication_basis_of_fear: ${ not publication_is_ok }
      - no_publication_basis_of_fear_user: ${ publication_harms_user_value }
      - no_publication_basis_of_fear_family_members: ${ bool(family_members_harmed_names) }
      - basis_of_fear_family_members_list: ${ ", ".join(family_members_harmed_names) }
      - is_victim_of_crime: ${ not publication_is_ok and why_not_publish["danger"] and (publication_danger_reasons["stalking"] or publication_danger_reasons["violence"]) }
      - is_affirming_gender_identity: ${ not publication_is_ok and ((why_not_publish["danger"] and (publication_danger_reasons["gender_identity"] or ((publication_danger_reasons["stalking"] or publication_danger_reasons["violence"]) and publication_danger_future_risk["reveal_gender_identity"]))) or (why_not_publish["discrimination"] and discrimination_reasons["gender_identity"])) }
      - other_basis_of_fear: ${ not publication_is_ok and ((why_not_publish["danger"] and publication_danger_reasons["other"]) or (why_not_publish["discrimination"] and (discrimination_reasons["past_person"] or discrimination_reasons["past_community"] or showifdef("discrimination_additional", False)))) }
      - no_publication_and_basis_of_fear_details: ${ no_publication_and_basis_of_fear_details_value }
      - signature_date__1: ${ format_date(signature_date, format="MM/dd/yyyy") if MLH_esign and MLH_esign_supported else "" }
      - petitioner_signature__1: |
          % if MLH_esign and MLH_esign_supported:
          /s/ ${ users[0].name.full(middle="full") }
          % else:
          ${ "" }
          % endif
      - petitioner_signature_esign_cite__1: ${ MLH_esign_tag if MLH_esign and MLH_esign_supported else "" }
      - petitioner_printed_name: ${ users[0].name.full(middle="full") }
      - case_number__3:

      # Parent or guardian consent signatures (used when changing children's names)
      - first_parent_or_guardian_signature_date: ${ format_date(signature_date, format="MM/dd/yyyy") if change_children_names and MLH_esign and MLH_esign_supported else "" }
      - first_parent_or_guardian_signature: |
          % if change_children_names and MLH_esign and MLH_esign_supported:
          /s/ ${ users[0].name.full(middle="full") }
          % else:
          ${ "" }
          % endif
      - first_parent_signature_esign_cite: ${ MLH_esign_tag if change_children_names and MLH_esign and MLH_esign_supported else "" }
      - first_parent_or_guardian_name: ${ users[0].name.full(middle="full") if change_children_names else (minor_first_signing_parent.name.full(middle="full") if (petitioner_is_minor and not emancipated_minor) else "") }
      - first_parent_or_guardian_address_line_one: |
          % if change_children_names:
          ${ users[0].address.line_one() }
          % elif petitioner_is_minor and not emancipated_minor:
          ${ minor_first_signing_parent.address.line_one() }
          % endif
      - first_parent_or_guardian_address_line_two: |
          % if change_children_names:
          ${ users[0].address.line_two() }
          % elif petitioner_is_minor and not emancipated_minor:
          ${ minor_first_signing_parent.address.line_two() }
          % endif
      - first_parent_or_guardian_phone_number: ${ phone_number_formatted(users[0].phone_number) if change_children_names else (phone_number_formatted(minor_first_signing_parent.phone_number) if (petitioner_is_minor and not emancipated_minor) and minor_first_signing_parent.phone_number else "") }
        
      # A participating spouse supplies the second parent signature information without requiring skipped parent-status answers.
      - second_parent_or_guardian_name: ${ children_other_parent.name.full(middle="full") if change_children_names and petitioner_relationship_to_children == "biological" and (not children_other_parent_questions_needed or (children_other_parent.is_alive and children_other_parent.agrees_to_name_change)) else (minor_second_signing_parent.name.full(middle="full") if (petitioner_is_minor and not emancipated_minor) and minor_second_signing_parent else "") }
      - second_parent_or_guardian_address_line_one: |
          % if change_children_names and petitioner_relationship_to_children == "biological" and not children_other_parent_questions_needed:
          ${ users[0].address.line_one() if spouse_address_same_as_user else spouse.address.line_one() }
          % elif change_children_names and petitioner_relationship_to_children == "biological" and children_other_parent_questions_needed and children_other_parent.is_alive and children_other_parent.whereabouts_known and children_other_parent.agrees_to_name_change:
          ${ users[0].address.line_one() if other_parent.address_same_as_user else other_parent.address.line_one() }
          % elif (petitioner_is_minor and not emancipated_minor) and minor_second_signing_parent:
          ${ minor_second_signing_parent.address.line_one() }
          % endif
      - second_parent_or_guardian_address_line_two: |
          % if change_children_names and petitioner_relationship_to_children == "biological" and not children_other_parent_questions_needed:
          ${ users[0].address.line_two() if spouse_address_same_as_user else spouse.address.line_two() }
          % elif change_children_names and petitioner_relationship_to_children == "biological" and children_other_parent_questions_needed and children_other_parent.is_alive and children_other_parent.whereabouts_known and children_other_parent.agrees_to_name_change:
          ${ users[0].address.line_two() if other_parent.address_same_as_user else other_parent.address.line_two() }
          % elif (petitioner_is_minor and not emancipated_minor) and minor_second_signing_parent:
          ${ minor_second_signing_parent.address.line_two() }
          % endif
      - second_parent_or_guardian_phone_number: |
          % if change_children_names and petitioner_relationship_to_children == "biological" and not children_other_parent_questions_needed and spouse.phone_number:
          ${ phone_number_formatted(spouse.phone_number) }
          % elif change_children_names and petitioner_relationship_to_children == "biological" and children_other_parent_questions_needed and children_other_parent.is_alive and children_other_parent.whereabouts_known and children_other_parent.agrees_to_name_change and other_parent.phone_number:
          ${ phone_number_formatted(other_parent.phone_number) }
          % elif (petitioner_is_minor and not emancipated_minor) and minor_second_signing_parent and minor_second_signing_parent.phone_number:
          ${ phone_number_formatted(minor_second_signing_parent.phone_number) }
          % endif

      # Spouse information (appears when spouse name is changing)
      - consenting_spouse_name: ${ spouse.name.full(middle="full") if change_spouse_name else "" }
      - consenting_spouse_address_line_one: ${ (users[0].address.line_one() if spouse_address_same_as_user else spouse.address.line_one()) if change_spouse_name else "" }
      
      - consenting_spouse_address_line_two: ${ (users[0].address.line_two() if spouse_address_same_as_user else spouse.address.line_two()) if change_spouse_name else "" }
      - consenting_spouse_phone_number: ${ spouse.phone_numbers() if change_spouse_name else "" }

      # Attorney information (not used)
      - attorney_signature__1:
      - attorney_name:
      - attorney_bar_number:
      - attorney_address_line_one:
      - attorney_address_line_two:
      - attorney_phone_number:

      # Minor consent signature (appears when petitioner is an unemancipated minor)
      - consenting_minor1_signature_date: ${ format_date(signature_date, format="MM/dd/yyyy") if petitioner_is_minor and not emancipated_minor and MLH_esign and MLH_esign_supported else "" }
      - consenting_minor1_signature: ${ "/s/ " + users[0].name.full(middle="full") if petitioner_is_minor and not emancipated_minor and MLH_esign and MLH_esign_supported else "" }
      - minor_signature_esign_cite: ${ MLH_esign_tag if petitioner_is_minor and not emancipated_minor and MLH_esign and MLH_esign_supported else "" }
      - consenting_minor1_name: ${ users[0].name.full(middle="full") if petitioner_is_minor and not emancipated_minor else "" }

      # Not used
      - consenting_minor2_name:
---
attachment:
  - name: Request for Hearing or Dismissal Regarding Name Change Proceeding - PC 162
    filename: request_hearing_dismissal_pc162
    variable name: request_hearing_dismissal_pc162[i]
    pdf template file: request_hearing_dismissal_pc162.pdf
    editable: False
    skip undefined: True
    fields:
      - trial_court: ${ the_court.number }
      - trial_court_county: ${ the_court.address.county.upper() }
      - trial_court_address_on_one_line: ${ the_court.address.on_one_line() }
      - trial_court_phone_number: ${ the_court.phone }
      - list_of_users_current_names: ${ comma_and_list([person.name.full(middle="full") for person in people_changing_names]) }
      - petitioner_block: |
          ${ users[0].name.full(middle="full") }
          ${ users[0].address.line_one() }
          ${ users[0].address.line_two() }
          ${ phone_number_formatted(users[0].phone_number) }
