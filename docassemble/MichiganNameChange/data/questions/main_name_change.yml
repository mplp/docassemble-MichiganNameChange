  Past Incidents of ${ "Stalking and Physical Violence" if publication_danger_reasons["stalking"] and publication_danger_reasons["violence"] else ("Stalking" if publication_danger_reasons["stalking"] else "Physical Violence") }
subquestion: |
  Describe the ${ ordinal(i) } past incident. Use complete sentences and proper punctuation. Your answer will appear on your form exactly how you enter it.

