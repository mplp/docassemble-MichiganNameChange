code: |
  danger_for_petitioner_only = change_petitioner_name and users[0] in publication_danger_people and len(publication_danger_people) == 1 and not ("someone_else" in publication_danger_selected_values)
  danger_for_others_only = (not change_petitioner_name or users[0] not in publication_danger_people)
  if danger_for_petitioner_only:
    danger_identity_subject = "I am"
    danger_identity_object = "me"
  elif danger_for_others_only:
    danger_identity_subject = "my family member is"
    danger_identity_object = "my family"
  else:
    danger_identity_subject = "I am or my family member is"
    danger_identity_object = "me or my family"
  danger_gender_default_text = (
    "Public notice of this proceeding would reveal to the public that {} a transgender person. "
    "Data from the 2015 U.S. Transgender Survey shows that nationally, nearly half of transgender people reported being verbally "
    "harassed and 9% reported being physically attacked in the past year because of being transgender (2015 U.S. Transgender Survey). "
    "The Human Rights Campaign reports at least 34 transgender and gender-nonconforming people were killed in the United States in "
    "2022 (Epidemic of Violence 2022 Report, HRC). I request that you keep this name change proceedings confidential to avoid public "
    "disclosure of transgender status which I fear, and the data shows, would increase the risk of {} experiencing violence."
  ).format(danger_identity_subject, danger_identity_object)
---
code: |
  discrimination_for_petitioner_only = change_petitioner_name and users[0] in discrimination_people and len(discrimination_people) == 1 and not ("someone_else" in discrimination_selected_values)
  discrimination_for_others_only = (not change_petitioner_name or users[0] not in discrimination_people)
  if discrimination_for_petitioner_only:
    discrimination_identity_subject = "I am"
    discrimination_identity_object = "me"
  elif discrimination_for_others_only:
    discrimination_identity_subject = "my family member is"
    discrimination_identity_object = "my family"
  else:
    discrimination_identity_subject = "I am or my family member is"
    discrimination_identity_object = "me or my family"
  discrimination_gender_default_text = (
    "Public notice of this proceeding would reveal to the public that {} a transgender person. "
    "Transgender individuals often face pervasive discrimination in multiple parts of their lives, including in employment and housing. "
    "Data from the 2015 U.S. Transgender Survey shows that nationally, 19% of transgender people reported being fired, not hired, or "
    "denied a promotion in the past year because they were transgender. 23% indicated they experienced housing discrimination in the "
    "past year (2015 U.S. Transgender Survey). I request that you keep this name change proceedings confidential to avoid public "
    "disclosure of transgender status which I fear, and the data shows, would likely result in {} experiencing discrimination and harassment."
  ).format(discrimination_identity_subject, discrimination_identity_object)
---
reconsider: True
code: |
  publication_harms_user_value = False
  publication_harms_family_members_value = False
  family_members_harmed_names = []
  basis_of_fear_family_names = []
  no_publication_detail_parts = []

  if not publication_is_ok and why_not_publish["danger"]:
    danger_names = [person.name.full(middle="full") for person in publication_danger_people]
    if ("someone_else" in publication_danger_selected_values):
      danger_names.append(publication_danger_someone_else_name)
    danger_for_user = change_petitioner_name and users[0] in publication_danger_people
    publication_harms_user_value = publication_harms_user_value or danger_for_user
    danger_family_names = [
      person.name.full(middle="full") for person in publication_danger_people
      if person.instanceName != users[0].instanceName
    ]
    if ("someone_else" in publication_danger_selected_values):
      danger_family_names.append(publication_danger_someone_else_name)
    if danger_family_names:
      publication_harms_family_members_value = True
      basis_of_fear_family_names.extend(danger_family_names)
      family_members_harmed_names.extend(danger_family_names)

    danger_parts = []
    if publication_danger_reasons["stalking"] or publication_danger_reasons["violence"]:
      if publication_danger_reasons["stalking"] and publication_danger_reasons["violence"]:
        danger_type = "physical violence and stalking"
      elif publication_danger_reasons["stalking"]:
        danger_type = "stalking"
      else:
        danger_type = "physical violence"
      danger_parts.append("{} have been the subject of {}. The following incidents occurred:".format(comma_and_list(danger_names), danger_type))
      for incident_number, incident in enumerate(publication_incidents, start=1):
        danger_parts.append("{}. {}".format(incident_number, incident.details.rstrip(". ") + "."))
      future_reasons = []
      if publication_danger_future_risk["find_family"]:
        future_reasons.append("it would make it easier for the perpetrator of the past stalking or violence to find my family")
      if publication_danger_future_risk["reveal_gender_identity"]:
        future_reasons.append("it would allow the perpetrator of the past stalking or violence to find out my family member's gender identity")
      if future_reasons:
        danger_parts.append("Publication would increase the danger in the future because {}.".format(comma_and_list(future_reasons)))
    if publication_danger_reasons["gender_identity"]:
      danger_parts.append(danger_gender_default_text if danger_gender_statement_choice == "default" else danger_gender_custom_text.rstrip(". ") + ".")
    if publication_danger_reasons["other"]:
      danger_parts.append("There is a risk of danger if information about this name change is published because {}.".format(publication_danger_other_reason.rstrip(". ")))
    no_publication_detail_parts.append("Danger or greater likelihood of physical danger:\n" + "\n\n".join(danger_parts))

  if not publication_is_ok and why_not_publish["discrimination"]:
    discrimination_names = [person.name.full(middle="full") for person in discrimination_people]
    if ("someone_else" in discrimination_selected_values):
      discrimination_names.append(discrimination_someone_else_name)
    discrimination_for_user = change_petitioner_name and users[0] in discrimination_people
    publication_harms_user_value = publication_harms_user_value or discrimination_for_user
    discrimination_family_names = [
      person.name.full(middle="full") for person in discrimination_people
      if person.instanceName != users[0].instanceName
    ]
    if ("someone_else" in discrimination_selected_values):
      discrimination_family_names.append(discrimination_someone_else_name)
    if discrimination_family_names:
      publication_harms_family_members_value = True
      family_members_harmed_names.extend(discrimination_family_names)
      basis_of_fear_family_names.extend(discrimination_family_names)

    discrimination_parts = []
    if ("past_person" in discrimination_reason_values):
      discrimination_parts.append("{} already experienced discrimination. {}. This discrimination is likely to continue or worsen if a notice is published or the record of the proceeding is available for access.".format(comma_and_list(discrimination_names), discrimination_history_person.rstrip(". ")))
    if ("past_community" in discrimination_reason_values):
      discrimination_parts.append("There has been past discrimination against other people in the community. {}. If a notice is published or the record of the proceeding is available for access, {} will be placed at risk of such discrimination.".format(discrimination_history_community.rstrip(". "), comma_and_list(discrimination_names)))
    if ("gender_identity" in discrimination_reason_values):
      discrimination_parts.append(discrimination_gender_default_text if discrimination_gender_statement_choice == "default" else discrimination_gender_custom_text.rstrip(". ") + ".")
    if discrimination_additional:
      discrimination_parts.append("Publishing information about this name change would increase the risk of discrimination because {}.".format(discrimination_additional_reason.rstrip(". ")))
    no_publication_detail_parts.append("Risk of unlawful discrimination or retaliation:\n" + "\n\n".join(discrimination_parts))

  # Preserve the order in which names first appear and remove duplicates.
  family_members_harmed_names = list(dict.fromkeys(family_members_harmed_names))
  basis_of_fear_family_names = list(dict.fromkeys(basis_of_fear_family_names))
  family_members_harmed_by_publication_value = comma_and_list(family_members_harmed_names)
  basis_of_fear_family_members_list_value = comma_and_list(basis_of_fear_family_names)
  no_publication_and_basis_of_fear_details_value = "\n\n".join(no_publication_detail_parts)
