id: birth certificate request
question: |
  Birth Certificate Request
subquestion: |
  There are two options for updating a birth certificate after a name change:

  * **Option 1:** The new name can be added to the birth certificate, **along with the old name**; OR
  * **Option 2:** A new birth certificate can be created with **only the new name**, and the original birth certificate can be sealed (hidden).

  You must decide now which option you want. It will be hard to change this decision after the name change is final.
fields:
  - Do you want new birth certificates with **only new names** on them for anyone (Option 2)?: birth_certificate_option
    input type: radio
    choices:
      - Yes: option_two
      - No, it’s fine to have the new names **AND** old names on all of the birth certificates.: option_one
  - label: |
      I want a new birth certificate with **only the new name (Option 2)** for the following people: (check all that apply)
    field: people_for_sealed_birth_certificate
    datatype: object_checkboxes
    choices: people_changing_names
    object labeler: |
      lambda person: person.name.full(middle="full")
    none of the above: False
    show if:
      variable: birth_certificate_option
      is: option_two
  - note: |
      **NOTE:** For either option, getting a final name change order does **not** automatically update the birth certificate.

      If you want to update a birth certificate and get a copy, you will need to record the name change with the Michigan Vital Records Changes department. You have to wait until the name change is final to update a birth certificate. If you want to learn more now, visit the state website [Correct A Birth Record](https://www.michigan.gov/mdhhs/doing-business/vitalrecords/additonal-information/correct-a-birth-record).
