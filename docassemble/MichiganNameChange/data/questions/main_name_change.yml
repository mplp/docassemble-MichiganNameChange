id: set selected criminal record subjects
depends on:
  - people_with_criminal_records
  - criminal_record_subject_labels
code: |
  criminal_record_selected_choices = [
    {subject: criminal_record_subject_labels[subject]}
    for subject in people_with_criminal_records.true_values()
  ]
