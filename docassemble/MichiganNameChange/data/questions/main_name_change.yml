  Public notice of this proceeding would reveal to the public that ${ danger_identity_subject } a transgender person. Data from the 2015 U.S. Transgender Survey shows that nationally, nearly half of transgender people reported being verbally harassed and 9% reported being physically attacked in the past year because of being transgender (2015 U.S. Transgender Survey). The Human Rights Campaign reports at least 34 transgender and gender-nonconforming people were killed in the United States in 2022 (Epidemic of Violence 2022 Report, HRC). I request that you keep this name change proceedings confidential to avoid public disclosure of transgender status which I fear, and the data shows, would increase the risk of ${ danger_identity_object } experiencing violence.
