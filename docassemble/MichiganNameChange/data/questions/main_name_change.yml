    input type: radio
    choices:
      - Yes: default
      - I want to edit the statement, or write my own statement about the risk of discrimination based on gender identity.: custom
  - Please write your own statement below.: discrimination_gender_custom_text
    input type: area
    rows: 8
    show if:
