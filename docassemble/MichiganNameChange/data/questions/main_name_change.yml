---
id: initialize children other parent status
code: |
  # HotDocs automatically treats a spouse who is changing their name
  # and is the children's other parent as participating and agreeing.
  children_other_parent_questions_needed = not (
    change_spouse_name and spouse_is_other_parent
  )

  if not children_other_parent_questions_needed:
    children_other_parent.is_alive = True
    children_other_parent.whereabouts_known = True
    children_other_parent.has_joint_legal_custody = True
    children_other_parent.joins_child_name_change_request = True
    children_other_parent.agrees_to_name_change = True
    children_other_parent.failed_contact_two_years = False
    children_other_parent.abuse_conviction = False
    children_other_parent.murder_conviction = False

---
id: changing children names part two
undefine:
  - children_other_parent.is_alive
  - children_other_parent.whereabouts_known
  - children_other_parent.has_joint_legal_custody
  - children_other_parent.joins_child_name_change_request
  - children_other_parent.agrees_to_name_change
  - children_other_parent.failed_contact_two_years
  - children_other_parent.abuse_conviction
  - children_other_parent.murder_conviction
question: |
  Changing Your Children's Names, Part 2
subquestion: |
  **Warning!** If you're trying to change the name of a child, all parents who share legal custody of the child have to agree to the proposed name change. Only a custodial parent can request a child's name be changed. However, the noncustodial parent must be given notice of the name change and hearing notice. If you want to learn more about changing a child's name, please return to **Michigan Legal Help** and read the [Changing Your Minor Child's Name](https://michiganlegalhelp.org/resources/family/changing-your-minor-childs-name) article.
fields:
  - Is ${ children_other_parent.name.first } still alive?: children_other_parent.is_alive
    datatype: yesnoradio
    show if:
      code: |
        children_other_parent_questions_needed

  - Do you know where ${ children_other_parent.name.first } lives?: children_other_parent.whereabouts_known
    datatype: yesnoradio
    js show if: |
      val("children_other_parent.is_alive")

  - Does ${ children_other_parent.name.first } have joint legal custody of the ${ "child" if children.target_number == 1 else "children" }?: children_other_parent.has_joint_legal_custody
    datatype: yesnoradio
    js show if: |
      val("children_other_parent.is_alive")

  - Is ${ children_other_parent.name.first } also asking the judge to change your ${ "child's name" if children.target_number == 1 else "children's names" }?: children_other_parent.joins_child_name_change_request
    datatype: yesnoradio
    js show if: |
      val("children_other_parent.is_alive") && val("children_other_parent.whereabouts_known") && val("children_other_parent.has_joint_legal_custody")

  - Does ${ children_other_parent.name.first } agree with the name change?: children_other_parent.agrees_to_name_change
    datatype: yesnoradio
    js show if: |
      val("children_other_parent.is_alive") && (!val("children_other_parent.has_joint_legal_custody") || (val("children_other_parent.whereabouts_known") && !val("children_other_parent.joins_child_name_change_request")))

  - note: |
      **We're sorry, this tool is not right for you. You cannot ask a judge to change the name of your child if your child's other parent has custody, but his or her whereabouts are unknown. You may want to contact a lawyer to help you with this matter. You can use the [Guide to Legal Help](https://michiganlegalhelp.org/guide-to-legal-help) on Michigan Legal Help to find a lawyer or a legal services office near you.**
    js show if: |
      val("children_other_parent.is_alive") && !val("children_other_parent.whereabouts_known") && val("children_other_parent.has_joint_legal_custody")

  - Has ${ children_other_parent.name.first } failed to visit, contact, or communicate with the ${ "child" if children.target_number == 1 else "children" } for the last two years?: children_other_parent.failed_contact_two_years
    datatype: yesnoradio
    js show if: |
      val("children_other_parent.is_alive") && !val("children_other_parent.has_joint_legal_custody") && !val("children_other_parent.agrees_to_name_change")

  - Has ${ children_other_parent.name.first } been convicted of child abuse, criminal sexual conduct, or assault with intent to commit criminal sexual conduct with the ${ "child" if children.target_number == 1 else "children" } or a sibling of the ${ "child" if children.target_number == 1 else "children" } as the victim?: children_other_parent.abuse_conviction
    datatype: yesnoradio
    js show if: |
      val("children_other_parent.is_alive") && !val("children_other_parent.has_joint_legal_custody") && !val("children_other_parent.agrees_to_name_change")

  - note: |
      **Attach a copy of the judgment of sentence.**
    js show if: |
      val("children_other_parent.abuse_conviction")

  - Has ${ children_other_parent.name.first } been convicted of first degree murder or second degree murder?: children_other_parent.murder_conviction
    datatype: yesnoradio
    js show if: |
      val("children_other_parent.is_alive") && !val("children_other_parent.has_joint_legal_custody") && !val("children_other_parent.agrees_to_name_change")

  - note: |
      **Attach a copy of the judgment of murder sentence.**
    js show if: |
      val("children_other_parent.murder_conviction")

  - note: |
      **Sorry, Michigan law requires the agreement of both parents to change a minor's name except under limited circumstances. Based on your answers, none of these circumstances are present in your case.**
    js show if: |
      val("children_other_parent.is_alive") && !val("children_other_parent.has_joint_legal_custody") && !val("children_other_parent.agrees_to_name_change") && !val("children_other_parent.failed_contact_two_years") && !val("children_other_parent.abuse_conviction") && !val("children_other_parent.murder_conviction")

  - note: |
      **Sorry, this tool is not right for you. Both parents with joint legal custody must agree to the child's name change.**
    js show if: |
      val("children_other_parent.is_alive") && val("children_other_parent.whereabouts_known") && val("children_other_parent.has_joint_legal_custody") && !val("children_other_parent.joins_child_name_change_request") && !val("children_other_parent.agrees_to_name_change")

continue button field: children_part_two
validation code: |
  # Hidden fields have no answer. Define only the values needed by later branches.
  if not children_other_parent.is_alive:
    children_other_parent.whereabouts_known = False
    children_other_parent.has_joint_legal_custody = False
    children_other_parent.joins_child_name_change_request = False
    children_other_parent.agrees_to_name_change = False
  elif not children_other_parent.has_joint_legal_custody or not children_other_parent.whereabouts_known:
    children_other_parent.joins_child_name_change_request = False
  if children_other_parent.is_alive and children_other_parent.has_joint_legal_custody and children_other_parent.whereabouts_known and children_other_parent.joins_child_name_change_request:
    children_other_parent.agrees_to_name_change = True
  elif children_other_parent.is_alive and children_other_parent.has_joint_legal_custody and not children_other_parent.whereabouts_known:
    children_other_parent.agrees_to_name_change = False
  if not children_other_parent.is_alive or children_other_parent.has_joint_legal_custody or children_other_parent.agrees_to_name_change:
    children_other_parent.failed_contact_two_years = False
    children_other_parent.abuse_conviction = False
    children_other_parent.murder_conviction = False
