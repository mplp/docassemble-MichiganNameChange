# When petitioner is a minor -- assign the correct parent/guardian to each parental consent field in PC51 or PC51c (petitions)
id: minor parent signers
depends on:
  # Recalculate the PDF signer objects after any parent-status answer is edited.
  - minor_parent_one.is_alive
  - minor_parent_one.has_legal_custody
  - minor_parent_one.agrees_to_name_change
  - minor_parent_two.is_alive
  - minor_parent_two.has_legal_custody
  - minor_parent_two.agrees_to_name_change
code: |
  if minor_parent_one.is_alive and minor_parent_one.has_legal_custody:
    minor_first_signing_parent = minor_parent_one
    minor_second_signing_parent = (
      minor_parent_two if minor_parent_two.is_alive and minor_parent_two.agrees_to_name_change else None
    )
  elif minor_parent_two.is_alive and minor_parent_two.has_legal_custody:
    minor_first_signing_parent = minor_parent_two
    minor_second_signing_parent = (
      minor_parent_one if minor_parent_one.is_alive and minor_parent_one.agrees_to_name_change else None
    )
  else:
    minor_first_signing_parent = minor_guardian
    minor_second_signing_parent = None
