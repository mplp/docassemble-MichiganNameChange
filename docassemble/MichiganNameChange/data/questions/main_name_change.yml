---
# Ask about birth certificate options
id: birth certificate request
depends on:
  # Re-ask the applicable version if the people included in the petition change
  - people_changing_names
question: |
  Birth Certificate Request
subquestion: |
  There are two options for updating a birth certificate after a name change:

  * **Option 1:** The new name can be added to the birth certificate, **along with the old name**; OR
  * **Option 2:** A new birth certificate can be created with **only the new name**, and the original birth certificate can be sealed (hidden).

  You must decide now which option you want. It will be hard to change this decision after the name change is final.
fields:
  - label: |
      Do you want a new birth certificate with **only** ${ "your" if change_petitioner_name else "your child’s" } new name on it (Option 2)?
    field: single_person_new_birth_certificate
    input type: radio
    choices:
      - "Yes": True
      - label: |
          ${ "No, it’s fine to have my new name **AND** old name on my birth certificate." if change_petitioner_name else "No, it’s fine to have my child’s new name **AND** old name on their birth certificate." }
        value: False
    show if:
      code: |
        len(people_changing_names) == 1
  - Do you want new birth certificates with **only new names** on them for anyone (Option 2)?: birth_certificate_option
    input type: radio
    choices:
      - Yes: option_two
      - No, it’s fine to have the new names **AND** old names on all of the birth certificates.: option_one
    show if:
      code: |
        len(people_changing_names) > 1
  - label: |
      I want a new birth certificate with **only** the new name **(Option 2)** for the following people: (check all that apply)
    field: people_for_sealed_birth_certificate
    datatype: object_checkboxes
    choices: people_changing_names
    object labeler: |
      lambda person: person.name.full(middle="full")
    none of the above: False
    js show if: |
      ${ "true" if len(people_changing_names) > 1 else "false" } && val("birth_certificate_option") == "option_two"
  - note: |
      If you **don’t** select someone, they will get **Option 1**, and both their old and new name will be on the updated birth certificate.
    js show if: |
      ${ "true" if len(people_changing_names) > 1 else "false" } && val("birth_certificate_option") == "option_two"
  - note: |
      **NOTE:** For either option, getting a final name change order does **not** automatically update the birth certificate.

      If you want to update a birth certificate and get a copy, you will need to record the name change with the Michigan Vital Records Changes department. You have to wait until the name change is final to update a birth certificate. If you want to learn more now, visit the state website [Correct A Birth Record](https://www.michigan.gov/mdhhs/doing-business/vitalrecords/additonal-information/correct-a-birth-record).
---
id: set single person birth certificate choices
if: len(people_changing_names) == 1
depends on:
  - people_changing_names
  - single_person_new_birth_certificate
code: |
  # Translate the single-person yes/no answer into the option value expected by the PDF attachment fields
  birth_certificate_option = "option_two" if single_person_new_birth_certificate else "option_one"
  # Keep a list of the people who selected the sealed/new-certificate option for shared attachment logic
  people_for_sealed_birth_certificate = [people_changing_names[0]] if single_person_new_birth_certificate else []
---
# Ask about publication of notice
id: publication notice
question: |
  Notice of Name Change
subquestion: |
  In most cases, you have to publish notice of name change hearings. Notice is usually published in special legal newspapers.

  You can ask the judge **not** to publish notice of the name change if publishing would:

  * put you or someone else in danger;
  * put you or someone else at risk of discrimination; or
  * be harmful for another important reason.

  You will need to explain why the name change hearing information should not be published. This interview will help you explain.

  If the judge does not agree to your request, you can decide whether to continue with the name change or not.
fields:
  - Are you OK with notice of the name change hearing being published?: publication_is_ok
    input type: radio
    choices:
      - Yes, I’m fine with publishing notice of the hearing.: True
      - No, I want to ask the judge **not** to publish notice.: False
---
# Determine reasons for no publication
id: reasons not to publish
depends on:
  - publication_is_ok
question: |
  Reasons to Not Publish
fields:
  - label: |
      Why should notice of the name change hearing not be published?

      (check all that apply):
    field: why_not_publish
    datatype: checkboxes
    choices:
      - It would put me or someone else in danger.: danger
      - It would put me or someone else at risk of discrimination.: discrimination
    none of the above: False
    minlength: 1
    validation messages:
      minlength: Select at least one reason why notice should not be published.
---
# Stalking explanation template
template: stalking_help
subject: |
  What does stalking mean?
content: |
  Stalking means repeated harassment that makes someone feel terrorized, frightened, intimidated, threatened, harassed, or molested.
---
# Gather the name changers who would be in danger from publication of notice
# Ask this even when only one person's name is changing because the user can also select "Someone else"
id: publication danger
depends on:
  # Rebuild person choices and clear inapplicable detail answers after review screen edits
  - why_not_publish
  - people_changing_names
question: |
  Publication Danger
fields:
  - label: |
      Who would be in danger if notice of the name change is published? (check all that apply)
    field: publication_danger_who
    datatype: checkboxes
    code: |
      [{person.instanceName: person.name.full(middle="full")} for person in people_changing_names] + [
        {"someone_else": "Someone else"}
      ]
    none of the above: False
    minlength: 1
    validation messages:
      minlength: |
        Select at least one person who would be in danger.

  - Who else not listed above would be in danger?: publication_danger_someone_else_name
    js show if: |
      val("publication_danger_who['someone_else']")

  - label: |
      Why would publishing notice of the name change hearing cause a risk of danger? (check all that apply)
    field: publication_danger_reasons
    datatype: checkboxes
    choices:
      - There have been past incidents of stalking, and publication could increase the risk of future stalking.: stalking
      - There have been past incidents of physical violence, and publication could increase the risk of future violence.: violence
      - This name change is related to gender identity and I am concerned about corresponding violence.: gender_identity
      - Another reason: other
    none of the above: False
    minlength: 1
    validation messages:
      minlength: |
        Select at least one reason publishing notice would create a risk of danger.

  - note: |
      ${ collapse_template(stalking_help) }

  - note: |
      **On the next page, you will enter information about past incidents of stalking or physical violence.**
    js show if: |
      val("publication_danger_reasons['stalking']") &&
      val("publication_danger_reasons['violence']")

  - note: |
      **On the next page, you will enter information about past incidents of stalking.**
    js show if: |
      val("publication_danger_reasons['stalking']") && !val("publication_danger_reasons['violence']")

  - note: |
      **On the next page, you will enter information about past incidents of physical violence.**
    js show if: |
      val("publication_danger_reasons['violence']") && !val("publication_danger_reasons['stalking']")

  - 'For “Another reason,” finish this sentence: “There is a risk of danger if information about this name change is published because…”': publication_danger_other_reason
    input type: area
    rows: 4
    js show if: |
      val("publication_danger_reasons['other']")

  - label: |
      How would publishing notice of the name change hearing increase the risk of physical violence or stalking in the future? (check all that apply)
    field: publication_danger_future_risk
    datatype: checkboxes
    choices:
      - It would make it easier for the perpetrator of the past stalking or violence to find the person or people in danger.: find_family
      - It would allow the perpetrator of the past stalking or violence to find out the gender identity of a person in danger.: reveal_gender_identity
    none of the above: True
    js show if: |
      val("publication_danger_reasons['stalking']") ||
      val("publication_danger_reasons['violence']")
---
# Create reusable list of name changers from "id: publication danger" who will be caused harm by publication
id: calculate publication danger selections
depends on:
  - publication_danger_who
  - people_changing_names
code: |
  # Convert the selected people into the current ALIndividual objects used by later wording and PDF calculations
  # "someone_else" remains separate because that person is not an ALIndividual name-change target
  publication_danger_people = [
    person
    for person in people_changing_names
