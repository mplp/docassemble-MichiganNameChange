attachment:
  - name: Petition for Name Change and Ex Parte Request for Nonpublication and Confidential Record - PC 51c
    filename: petition_for_name_change_pc51c
    variable name: petition_for_name_change_pc51c[i]
    pdf template file: petition_for_name_change_pc51c.pdf
    #pdftk: True
    editable: False
    skip undefined: True
    fields:
      - trial_court: ${ the_court.number }
      - case_number:
      - trial_court_county: ${ the_court.address.county.upper() }
      - trial_court_address_on_one_line: ${ the_court.address.on_one_line() }
      - trial_court_phone_number: ${ the_court.phone }
      - list_of_users_current_names: ${ comma_and_list([person.name.full(middle="full") for person in people_changing_names]) }
        
      - petitioner_block: |
          ${ users[0].name.full(middle="full") }
          ${ users[0].address.line_one() }
          ${ users[0].address.line_two() }
          ${ phone_number_formatted(users[0].phone_number) }
      - petitioners_attorney_block:
        
      - has_previous_case: ${ family_court_cases }
      - previous_case_court: ${ 'See "Confidential Case Inventory"' if family_court_cases else "" }
        
      - previous_case_number:
      - judge:
      - previously_filed_case_remains_pending:
      - previously_filed_case_no_longer_pending:
        
      - name_change_for: ${ True }
      - name_change_for_married_user: ${ name_change_target_group == "both" or change_spouse_name }
      - name_change_for_spouse: ${ change_spouse_name }
      - name_change_for_minor_children: ${ change_children_names }
      - name_change_for_adult_only: ${ change_petitioner_name and not change_spouse_name and not change_children_names and (not petitioner_is_minor or emancipated_minor) }
      - emancipated_minor_note: ${ "(Emancipated minor)" if petitioner_is_minor and emancipated_minor else "" }
      - name_change_for_minor_only: ${ (petitioner_is_minor and not emancipated_minor) or (change_children_names and not change_petitioner_name) }
      - includes_request_for_minor: ${ (petitioner_is_minor and not emancipated_minor) or change_children_names }
        
      - first_parent_name: ${ (minor_parent_one.name.full(middle="full") + (" - Deceased" if not minor_parent_one.is_alive else "")) if ((petitioner_is_minor and not emancipated_minor) or (change_children_names and petitioner_relationship_to_children == "guardian")) else (users[0].name.full(middle="full") if change_children_names and petitioner_relationship_to_children == "biological" else "") }
      - first_parent_is_deceased: ${ ((petitioner_is_minor and not emancipated_minor) or (change_children_names and petitioner_relationship_to_children == "guardian")) and not minor_parent_one.is_alive }
        
      - second_parent_name: ${ (minor_parent_two.name.full(middle="full") + (" - Deceased" if not minor_parent_two.is_alive else "")) if ((petitioner_is_minor and not emancipated_minor) or (change_children_names and petitioner_relationship_to_children == "guardian")) else ((children_other_parent.name.full(middle="full") + (" - Deceased" if not children_other_parent.is_alive else "")) if change_children_names and petitioner_relationship_to_children == "biological" else "") }
      - second_parent_is_deceased: ${ (((petitioner_is_minor and not emancipated_minor) or (change_children_names and petitioner_relationship_to_children == "guardian")) and not minor_parent_two.is_alive) or (change_children_names and petitioner_relationship_to_children == "biological" and not children_other_parent.is_alive) }
        
      - minor_guardian_name: ${ minor_guardian.name.full(middle="full") if (petitioner_is_minor and not emancipated_minor) and minor_first_signing_parent is minor_guardian else "" }
      - mentally_incompetent_parent_guardian:
      - minor_consent: ${ (petitioner_is_minor and not emancipated_minor) }
        
      - consent_parents_jointly: ${ ((petitioner_is_minor and not emancipated_minor) and minor_parent_one.is_alive and minor_parent_two.is_alive and minor_parent_one.agrees_to_name_change and minor_parent_two.agrees_to_name_change) or (change_children_names and petitioner_relationship_to_children == "biological" and children_other_parent.is_alive and children_other_parent.agrees_to_name_change) }
      - consent_sole_surviving_parent: ${ ((petitioner_is_minor and not emancipated_minor) and ((minor_parent_one.is_alive and minor_parent_one.agrees_to_name_change and not minor_parent_two.is_alive) or (minor_parent_two.is_alive and minor_parent_two.agrees_to_name_change and not minor_parent_one.is_alive))) or (change_children_names and petitioner_relationship_to_children == "biological" and not children_other_parent.is_alive) }
      - consent_only_available_parent: ${ ((petitioner_is_minor and not emancipated_minor) and ((minor_parent_one.is_alive and minor_parent_one.agrees_to_name_change and not minor_parent_two.is_alive) or (minor_parent_two.is_alive and minor_parent_two.agrees_to_name_change and not minor_parent_one.is_alive) or (minor_parent_one.is_alive and minor_parent_two.is_alive and ((minor_parent_one.agrees_to_name_change and not minor_parent_two.has_legal_custody) or (minor_parent_two.agrees_to_name_change and not minor_parent_one.has_legal_custody))))) or (change_children_names and petitioner_relationship_to_children == "biological" and not spouse_is_other_parent and (not children_other_parent.is_alive or not children_other_parent.has_joint_legal_custody)) }
      - consent_guardian: ${ (change_children_names and petitioner_relationship_to_children == "guardian") or ((petitioner_is_minor and not emancipated_minor) and minor_first_signing_parent is minor_guardian) }
