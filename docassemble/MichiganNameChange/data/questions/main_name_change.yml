    datatype: yesnoradio
  - note: |
      **Sorry, but this tool is not right for you. You must have legal custody of the child to apply for that child's name change.**
    js show if: |
      val("petitioner_has_legal_custody_of_all_children") === false
  - Do all of the children whose names you want to change have the same other parent?: children_have_same_other_parent
    datatype: yesnoradio
    js show if: |
      val("petitioner_has_legal_custody_of_all_children")
  - note: |
      **With this tool, the children whose names are being changed must have the same two parents.**

      **If you want to change the names of children with a different other parent, you must file a separate petition.**
    js show if: |
      val("petitioner_has_legal_custody_of_all_children") && val("children_have_same_other_parent") === false
  - Is ${ spouse.name.first if change_spouse_name else "your spouse" } the children's other parent?: spouse_is_other_parent
    datatype: yesnoradio
    js show if: |
      ${ "true" if change_spouse_name else "false" } && val("petitioner_has_legal_custody_of_all_children") && val("children_have_same_other_parent")
  - label: |
      How many minor children's names should be included in this petition?

      ***All children listed in this petition must have the same other parent and be under the age of 18.***
    field: children.target_number
    datatype: integer
    min: 1
    js show if: |
      val("petitioner_has_legal_custody_of_all_children") && val("children_have_same_other_parent")
    validation messages:
      min: |
        You need to have at least one minor child that you are requesting a name change for.
