      - spouse_or_child_criminal_record: >-
          ${ "; ".join(
          "{}: {}".format(label, "; ".join("{} ({})".format(record.charge, record.date) for record in criminal_records if record.person == subject))
          for subject, label in (("spouse", "Spouse"), ("minor_child", "A minor child"))
