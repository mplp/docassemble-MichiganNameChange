subject: |
  What should I include?
content: |
  When describing an incident, here are some things you might want to include:

  - What happened
  - Where it happened
  - The date—it’s okay to be approximate, such as “winter of 2022”
  - Whether you or anyone else was injured or negatively affected by the incident
  - How the incident made you or someone else feel. You could include a sentence like: “Because of this incident, I felt...”
  - Whether a police report was filed and, if so, the date it was filed
