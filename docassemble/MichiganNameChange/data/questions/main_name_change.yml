id: publication notice
question: |
  Notice of Name Change
subquestion: |
  In most cases, you have to publish notice of name change hearings. Notice is usually published in special legal newspapers.

  You can ask the judge **not** to publish notice of the name change if publishing would:

  * put you or someone else in danger;
  * put you or someone else at risk of discrimination; or
  * be harmful for another important reason.

  You will need to explain why the name change hearing information should not be published. This interview will help you explain.

  If the judge does not agree to your request, you can decide whether to continue with the name change or not.
fields:
  - Are you OK with notice of the name change hearing being published?: publication_is_ok
    input type: radio
    choices:
      - Yes, I’m fine with publishing notice of the hearing.: True
      - No, I want to ask the judge **not** to publish notice.: False
---
id: reasons not to publish
continue button field: reasons_not_to_publish_complete
question: |
  Reasons to Not Publish
fields:
  - label: |
      Why should notice of the name change hearing not be published?

      (check all that apply):
    field: why_not_publish
    datatype: checkboxes
    choices:
      - It would put me or someone else in danger.: danger
      - It would put me or someone else at risk of discrimination.: discrimination
    none of the above: False
    minlength: 1
    validation messages:
      minlength: Select at least one reason why notice should not be published.
---
template: stalking_help
subject: |
  What does stalking mean?
content: |
  Stalking means repeated harassment that makes someone feel terrorized, frightened, intimidated, threatened, harassed, or molested.
---
id: publication danger
continue button field: publication_danger_complete
question: |
  Publication Danger
fields:
  - label: |
      Who would be in danger if notice of the name change is published? (check all that apply)
    field: publication_danger_who
    datatype: checkboxes
    code: |
      [{person.instanceName: person.name.full(middle="full")} for person in people_changing_names] + [
        {"someone_else": "Someone else"}
      ]
    none of the above: False
    minlength: 1
    validation messages:
      minlength: |
        Select at least one person who would be in danger.

  - Who else not listed above would be in danger?: publication_danger_someone_else_name
    js show if: |
      val("publication_danger_who['someone_else']")

  - label: |
      Why would publishing notice of the name change hearing cause a risk of danger? (check all that apply)
    field: publication_danger_reasons
    datatype: checkboxes
    choices:
      - There have been past incidents of stalking, and publication could increase the risk of future stalking.: stalking
      - There have been past incidents of physical violence, and publication could increase the risk of future violence.: violence
      - This name change is related to gender identity and I am concerned about corresponding violence.: gender_identity
      - Another reason: other
    none of the above: False
    minlength: 1
    validation messages:
      minlength: |
        Select at least one reason publishing notice would create a risk of danger.

  - note: |
      ${ collapse_template(stalking_help) }
      
  - note: |
      **On the next page, you will enter information about past incidents of stalking or physical violence.**
    js show if: |
      val("publication_danger_reasons['stalking']") &&
      val("publication_danger_reasons['violence']")

  - note: |
      **On the next page, you will enter information about past incidents of stalking.**
    js show if: |
      val("publication_danger_reasons['stalking']") && !val("publication_danger_reasons['violence']")

  - note: |
      **On the next page, you will enter information about past incidents of physical violence.**
    js show if: |
      val("publication_danger_reasons['violence']") && !val("publication_danger_reasons['stalking']")
      
  - 'For “Another reason,” finish this sentence: “There is a risk of danger if information about this name change is published because…”': publication_danger_other_reason
    input type: area
    rows: 4
    js show if: |
      val("publication_danger_reasons['other']")

  - label: |
      How would publishing notice of the name change hearing increase the risk of physical violence or stalking in the future? (check all that apply)
    field: publication_danger_future_risk
    datatype: checkboxes
    choices:
      - It would make it easier for the perpetrator of the past stalking or violence to find my family.: find_family
      - It would allow the perpetrator of the past stalking or violence to find out my family member's gender identity.: reveal_gender_identity
    none of the above: True
    js show if: |
      val("publication_danger_reasons['stalking']") ||
      val("publication_danger_reasons['violence']")

validation code: |
  publication_danger_selected_values = (
    publication_danger_who.true_values()
  )

  publication_danger_people = [
    person
    for person in people_changing_names
    if person.instanceName in publication_danger_selected_values
  ]

  if (
    ("someone_else" in publication_danger_selected_values)
    and not publication_danger_someone_else_name.strip()
  ):
    validation_error(
      "Enter the name of the other person who would be in danger.",
      field="publication_danger_someone_else_name"
    )

  if (
    publication_danger_reasons["other"]
    and not publication_danger_other_reason.strip()
  ):
    validation_error(
      "Explain the other reason publishing notice would create a risk of danger.",
      field="publication_danger_other_reason"
    )

---
