# Gather name change targets with criminal records
id: criminal records
depends on:
  # A name target change can switch this screen between its single- and multiple-person forms
  - people_changing_names
question: |
  Criminal Records
subquestion: |
  % if len(people_changing_names) > 1:
  Does any person applying for a name change have a criminal record?
  % endif

  Having a criminal record doesn’t mean your request for name change will be automatically denied. However, the judge may decide to schedule a hearing to decide if you are asking to change your name for a fraudulent reason, such as wanting to escape your criminal history.

  You must report any criminal records, including:

  * open or closed criminal cases
  * cases from out of state
  * very old records, including juvenile records

  If someone has a criminal record, select them below. Otherwise, the judge might think they are trying to hide something.
fields:
  - ${ "Do you have a criminal record?" if change_petitioner_name else "Does " + people_changing_names[0].name.full(middle="full") + " have a criminal record?" }: single_person_has_criminal_record
    datatype: yesnoradio
    show if:
      code: |
        len(people_changing_names) == 1
  - label: |
      Does any person listed here have a criminal record? (check all that apply)
    field: people_with_criminal_records
    datatype: checkboxes
    code: |
      criminal_record_subject_choices
    none of the above: True
    show if:
      code: |
        len(people_changing_names) > 1
---
# Normalize the single-person yes/no answer into the same DADict structure used by the multiple-person checkbox screen
# Yesnoradio will be used for cases where there is only one person's aname changing -- could be any type of petitioner or a minor child
id: set single person criminal record selection
if: len(people_changing_names) == 1
depends on:
  - people_changing_names
  - single_person_has_criminal_record
  - change_petitioner_name
