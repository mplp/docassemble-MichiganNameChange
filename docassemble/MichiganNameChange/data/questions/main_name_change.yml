# Make sure change petitioner name is True for a minor petitioner (including emancipated) and set other name change targets to False
id: minor name change target flags
if: petitioner_is_minor
depends on:
  - petitioner_is_minor
code: |
  change_petitioner_name = True
  change_spouse_name = False
  change_children_names = False
---
# Gather unemancipated minor petitioner's reason for name change 
# Asked in this separate screen for unemancipated minors (emancipated minors are not asked for a reason in LHI)
id: minor reason for name change
if: petitioner_is_minor and not emancipated_minor
question: |
  Why do you want to change your name?
fields:
  - 'In a brief sentence, say why you want this name change. For example: "I want to change my name because I want to take my stepfather’s name."': reason_for_name_change
    input type: area
    rows: 3
    maxlength: 500
---
# The interview order requests this screen only for adult petitioners
# Minor petitioners (including emancipated minors) skip this screen
# An adult changing their own name along with children's names is treated as the children's parent
# Spouse name change is only available when adult petitioner is changing their own name as well
# The guardian option is available only when the adult petitioner is changing children's names without changing their own name
# Active divorce kickout option for adult petitioner changing only their own name
#
# All behavior matches current LHI options
#
# Available adult paths:
# - Petitioner only
# - Petitioner and spouse
# - Petitioner, spouse, and children
# - Petitioner and children
# - Children only, filed by a parent or guardian
id: whose names are changing
if: not petitioner_is_minor
question: |
  Whose name is changing?
fields:
  - Whose names do you want to change?: name_change_target_group
    input type: radio
    choices:
      - Adults (yourself, your spouse): adults
      - Minor children: children
      - Both: both
  - What adults are asking for a name change?: adults_changing_name
    input type: radio
    choices:
      - Me: myself
      - Both me and my spouse: both
    js show if: |
      val("name_change_target_group") == "adults" || val("name_change_target_group") == "both"
  - note: |
      You cannot apply to change **only** your spouse's name. If only your spouse is changing his or her name, your spouse should apply.
    js show if: |
      val("name_change_target_group") == "adults" || val("name_change_target_group") == "both"
  - Do you have a divorce case currently pending?: pending_divorce_case
    datatype: yesnoradio
    js show if: |
      val("name_change_target_group") == "adults" && val("adults_changing_name") == "myself"
  - Who filed the divorce case?: divorce_filer
    input type: radio
    choices:
      - I did: petitioner
      - My spouse did: spouse
    js show if: |
      val("name_change_target_group") == "adults" && val("adults_changing_name") == "myself" && val("pending_divorce_case")
  - note: |
      A plaintiff in a divorce case (the party who files the case) can ask for a name change in their Complaint for Divorce IF they are a woman. (At this time Michigan law does not allow a man to change their name as part of a divorce.) Doing this in the divorce case would save you the time and money of starting a separate name change case.
    js show if: |
      val("name_change_target_group") == "adults" && val("adults_changing_name") == "myself" && val("pending_divorce_case") && val("divorce_filer") == "petitioner"
  - note: |
      If you filed a Complaint for Divorce that did not include a request for a name change, you may be able to file an amended complaint to change it.
    js show if: |
      val("name_change_target_group") == "adults" && val("adults_changing_name") == "myself" && val("pending_divorce_case") && val("divorce_filer") == "petitioner"
  - note: |
      A defendant in a divorce case can ask for a name change by filing a Counterclaim for Divorce IF they are a woman. (At this time Michigan law does not allow a man to change their name as part of a divorce.) This would save you the time and money of starting a separate name change case. You can prepare an Answer and Counterclaim using the [Do-It-Yourself Answer and Counterclaim for Divorce](https://michiganlegalhelp.org/resources/family/do-it-yourself-answer-and-counterclaim-divorce).
    js show if: |
      val("name_change_target_group") == "adults" && val("adults_changing_name") == "myself" && val("pending_divorce_case") && val("divorce_filer") == "spouse"
  - Would you like to exit this tool now or continue and prepare a name change petition?: divorce_name_change_path
    input type: radio
    choices:
      - Exit and change my name through the divorce case.: divorce
      - Continue and file a separate Petition for Name Change.: separate
    js show if: |
      val("name_change_target_group") == "adults" && val("adults_changing_name") == "myself" && val("pending_divorce_case")
  - What is your relationship to the children?: petitioner_relationship_to_children
    input type: radio
    choices:
      - Parent: biological
      - Legal guardian: guardian
    js show if: |
      val("name_change_target_group") == "children"
  - note: |
      **Warning!** If you're trying to change the name of a child, all parents who share legal custody of the child have to agree to the proposed name change. Only a custodial parent can request a child's name be changed. However, the noncustodial parent must be given notice of the name change and hearing notice. If you want to learn more about changing a child's name, please return to **Michigan Legal Help** and read the [Changing Your Minor Child's Name](https://michiganlegalhelp.org/resources/family/changing-your-minor-childs-name) article.
    js show if: |
      val("name_change_target_group") == "children" || val("name_change_target_group") == "both"
  - note: |
      **If you are the legal guardian of the children listed in this petition you will need to submit letters of guardianship with your petition.**
    js show if: |
      val("name_change_target_group") == "children" && val("petitioner_relationship_to_children") == "guardian"
  - 'In a brief sentence, say why you want this name change. For example: "I want to change my name because I want to take my stepfather’s name."': reason_for_name_change
    input type: area
    rows: 3
    maxlength: 500
    js show if: |
      val("name_change_target_group") == "adults" || val("name_change_target_group") == "children" || val("name_change_target_group") == "both"
---
# Moved out of (id: whose names are changing) validation code so that these can be updated based on review screen edits
id: set adult petitioner and children name change targets
if: not petitioner_is_minor
depends on:
  - petitioner_is_minor
  - name_change_target_group
code: |
  # Determine whether the adult petitioner and any children are changing names
  # These Boolean values let the interview order, selection screens, and PDF fields use the same target information
  change_petitioner_name = name_change_target_group in ("adults", "both")
  change_children_names = name_change_target_group in ("children", "both")

  # LHI treats an adult changing their own name with their children's names as the children's biological parent rather than a guardian
  # Assign the relationship here because that question is intentionally not shown on the combined adult-and-children path
  if name_change_target_group == "both":
    petitioner_relationship_to_children = "biological"
---
# Moved out of (id: whose names are changing) validation code so that these can be updated based on review screen edits
id: set spouse name change target when adults are changing names
if: |
  (not petitioner_is_minor and name_change_target_group in ("adults", "both"))
depends on:
  - petitioner_is_minor
  - name_change_target_group
  - adults_changing_name
code: |
  # Adults_changing_name is asked only when an adult name is being changed
  # Keep this calculation separate so the children-only path does not require an answer to the hidden adult-name question
  change_spouse_name = adults_changing_name == "both"
---
# Moved out of (id: whose names are changing) validation code so that these can be updated based on review screen edits
id: set spouse name change target to False when only children are changing names
if: |
  (not petitioner_is_minor and name_change_target_group == "children")
depends on:
  - petitioner_is_minor
  - name_change_target_group
code: |
  # A spouse cannot be changing their name on the children-only path
  # Define the value explicitly because later interview and attachment logic expects a Boolean on every adult-petitioner path
  change_spouse_name = False
---
# Moved out of (id: whose names are changing) validation code so that these can be updated based on review screen edits
id: set whether there are children changing names
depends on:
  - change_children_names
code: |
  # Set whether the children DAList contains any items based on whether children's names are changing
  children.there_are_any = change_children_names
---
