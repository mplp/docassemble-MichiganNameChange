      - noncustodial_parent_failed_to_comply_with_support_order: ${ (petitioner_is_minor and not emancipated_minor) and ((minor_parent_one.is_alive and not minor_parent_one.has_legal_custody and not minor_parent_one.agrees_to_name_change and minor_parent_one.failed_contact_two_years and minor_parent_one.support_failure_type == "support_order") or (minor_parent_two.is_alive and not minor_parent_two.has_legal_custody and not minor_parent_two.agrees_to_name_change and minor_parent_two.failed_contact_two_years and minor_parent_two.support_failure_type == "support_order")) }
      - noncustodial_parent_failed_to_provide_support_without_order: ${ (petitioner_is_minor and not emancipated_minor) and ((minor_parent_one.is_alive and not minor_parent_one.has_legal_custody and not minor_parent_one.agrees_to_name_change and minor_parent_one.failed_contact_two_years and minor_parent_one.support_failure_type == "no_support_order") or (minor_parent_two.is_alive and not minor_parent_two.has_legal_custody and not minor_parent_two.agrees_to_name_change and minor_parent_two.failed_contact_two_years and minor_parent_two.support_failure_type == "no_support_order")) }
      - noncustodial_parent_has_abuse_conviction: ${ ((petitioner_is_minor and not emancipated_minor) and ((minor_parent_one.is_alive and not minor_parent_one.has_legal_custody and not minor_parent_one.agrees_to_name_change and minor_parent_one.abuse_conviction) or (minor_parent_two.is_alive and not minor_parent_two.has_legal_custody and not minor_parent_two.agrees_to_name_change and minor_parent_two.abuse_conviction))) or (change_children_names and petitioner_relationship_to_children == "biological" and children_other_parent.is_alive and not children_other_parent.has_joint_legal_custody and children_other_parent.abuse_conviction) }
      - noncustodial_parent_has_murder_conviction: ${ ((petitioner_is_minor and not emancipated_minor) and ((minor_parent_one.is_alive and not minor_parent_one.has_legal_custody and not minor_parent_one.agrees_to_name_change and minor_parent_one.murder_conviction) or (minor_parent_two.is_alive and not minor_parent_two.has_legal_custody and not minor_parent_two.agrees_to_name_change and minor_parent_two.murder_conviction))) or (change_children_names and petitioner_relationship_to_children == "biological" and children_other_parent.is_alive and not children_other_parent.has_joint_legal_custody and children_other_parent.murder_conviction) }
        
