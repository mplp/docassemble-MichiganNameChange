template: discrimination_help
subject: |
  What is discrimination?
content: |
  **Discrimination is generally not allowed in:**

  * Jobs (for example being fired, not being hired, being harassed at work)
  * Housing
  * Education
  * Public accommodations (shops, restaurants, hotels)
  * Public Services (service from state agencies, public benefits)

  **Based on someone's:**

  * Sex
  * Gender identity
  * Sexual orientation
  * Race
  * Ethnicity
  * Color
  * National origin
  * Disability
  * Religion
  * Marital status
  * Familial status
---
id: discrimination
continue button field: discrimination_complete
question: |
  Discrimination
subquestion: |
  ${ collapse_template(discrimination_help) }
fields:
  - label: |
      Who would be at risk of discrimination if notice of the name change is published?
    field: discrimination_who
    datatype: checkboxes
    code: |
      [
        {person.instanceName: person.name.full(middle="full")}
        for person in people_changing_names
      ] + [{"someone_else": "Someone else"}]
    none of the above: False
    minlength: 1
    validation messages:
      minlength: |
        Select at least one person who would be at risk of discrimination.
  - Who else not listed above is at risk of discrimination?: discrimination_someone_else_name
    js show if: |
      val("discrimination_who['someone_else']")
  - label: |
      Why do you think there is a risk of discrimination? (Check all that apply)
    field: discrimination_reasons
    datatype: checkboxes
    choices:
      - There has been past discrimination against the above person, and I am afraid it will continue or get worse if notice is published.: past_person
      - There has been past discrimination against other people in our community, and I am afraid it will happen to us if notice is published.: past_community
      - This name change is related to gender identity and I am concerned about corresponding discrimination.: gender_identity
    none of the above: False
    minlength: 1
    validation messages:
      minlength: |
        Select at least one reason there is a risk of discrimination.
    js show if: |
      val("discrimination_who").length > 0
  - "Briefly describe the past discrimination against the above person:": discrimination_history_person
    input type: area
    rows: 5
    js show if: |
      val("discrimination_who").length > 0 &&
      val("discrimination_reasons['past_person']")
  - note: |
      Use complete sentences and proper punctuation. Your answer will appear on your form exactly how you enter it.
    js show if: |
      val("discrimination_who").length > 0 &&
      val("discrimination_reasons['past_person']")
  - "Briefly describe the past discrimination against other people in your community:": discrimination_history_community
    input type: area
    rows: 5
    js show if: |
      val("discrimination_who").length > 0 &&
      val("discrimination_reasons['past_community']")
  - note: |
      Use complete sentences and proper punctuation. Your answer will appear on your form exactly how you enter it.
    js show if: |
      val("discrimination_who").length > 0 &&
      val("discrimination_reasons['past_community']")
  - Do you want to say anything more to explain why publishing the name change information would increase the risk of discrimination?: discrimination_additional
    datatype: yesnoradio
    js show if: |
      val("discrimination_who").length > 0 &&
      val("discrimination_reasons").length > 0
  - 'Finish this sentence: “Publishing information about this name change would increase the risk of discrimination because…”': discrimination_additional_reason
    input type: area
    rows: 4
    js show if: |
      val("discrimination_who").length > 0 &&
      val("discrimination_reasons").length > 0 &&
      val("discrimination_additional")
validation code: |
  discrimination_selected_values = discrimination_who.true_values()

  discrimination_reason_values = (
    discrimination_reasons.true_values()
    if len(discrimination_selected_values) > 0
    else []
  )

  discrimination_people = [
    person
    for person in people_changing_names
    if person.instanceName in discrimination_selected_values
  ]

  if ("someone_else" in discrimination_selected_values) and not discrimination_someone_else_name.strip():
    validation_error("Enter the name of the other person at risk of discrimination.", field="discrimination_someone_else_name")
  if ("past_person" in discrimination_reason_values) and not discrimination_history_person.strip():
    validation_error("Describe the past discrimination against the person or people selected above.", field="discrimination_history_person")
  if ("past_community" in discrimination_reason_values) and not discrimination_history_community.strip():
    validation_error("Describe the past discrimination against other people in your community.", field="discrimination_history_community")
  if discrimination_additional and not discrimination_additional_reason.strip():
    validation_error("Explain why publication would increase the risk of discrimination.", field="discrimination_additional_reason")
